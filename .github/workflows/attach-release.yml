name: Attach release assets

# 把各端 CI artifact 直接挂到已存在的 GitHub Release（2026-11-01）。
# 大包（完整 APK / deb / rpm / EXE）在 Actions 网络里取，不经过本机下载。
on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag（必须已存在）'
        required: true
        type: string
      version:
        description: '版本号（文件名用）'
        required: true
        default: '1.31.0'
        type: string
      cutoff:
        description: '忽略早于该 UTC 时间的 artifact（带版本号的也算，2026-11-01T19:30:00Z）'
        required: false
        default: ''
        type: string

permissions:
  contents: write
  actions: read

jobs:
  attach:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 下载并归位 1.31.0 artifacts
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
          V: ${{ inputs.version }}
          CUTOFF: ${{ inputs.cutoff }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          mkdir -p assets work
          wrote=()
          tag_date="$(gh release view "$TAG" --json publishedAt,createdAt --jq '(.publishedAt // .createdAt)[:10]')"
          # 同名 artifact 只留最新一份（历史 run 会重复产出同名包）：按 created_at
          # 倒序后 awk 只保留每个 name 的第一行。cutoff 对带版本号的名字同样生效。
          gh api --paginate "repos/$REPO/actions/artifacts?per_page=100" \
            --jq '.artifacts[] | [.id,.name,.created_at] | @tsv' \
            | awk -F'\t' -v c="$CUTOFF" 'c == "" || $3 >= c' \
            | sort -t$'\t' -k3,3r \
            | awk -F'\t' '!seen[$2]++ || $2 == "opi-packages" || $2 == "opi-asr-engine-linux"' > work/artifacts.tsv
          while IFS=$'\t' read -r id name created; do
            case "$name" in
              opi-packages|opi-asr-engine-linux)
                # 无版本号的老 artifact 很多；只取本发布日构建的包。
                case "$created" in "$tag_date"*) ;; *) continue ;; esac
                ;;
              *"v$V"*) ;;
              *) continue ;;
            esac
            case "$name" in
              opi-android-release-*|opi-windows-exe-*|opi-packages|opi-ios-keyboard-*|opi-macos-ime-*|opi-harmony*|opi-asr-engine-*) ;;
              *) continue ;;
            esac
            d="work/$id-$(echo "$name" | tr -c 'A-Za-z0-9._-' '_')"
            rm -rf "$d"; mkdir -p "$d"
            gh api "repos/$REPO/actions/artifacts/$id/zip" > "$d/a.zip" || continue
            unzip -q "$d/a.zip" -d "$d" || continue
            case "$name" in
              opi-android-release-*)
                tier=normal
                case "$name" in *-full) tier=full;; *-basic) tier=basic;; esac
                apk="$(find "$d" -name '*.apk' | head -1)"
                [ -n "$apk" ] || continue
                suffix=""; [ "$tier" = normal ] || suffix="-$tier"
                cp "$apk" "assets/opi-$V-android-universal${suffix}.apk"
                wrote+=("opi-$V-android-universal${suffix}.apk")
                ;;
              opi-windows-exe-*)
                tier=normal
                case "$name" in *-full) tier=full;; *-basic) tier=basic;; esac
                exe="$(find "$d" -name '*.exe' | head -1)"
                [ -n "$exe" ] || continue
                suffix=""; [ "$tier" = normal ] || suffix="-$tier"
                cp "$exe" "assets/opi-$V-windows-x64${suffix}-setup.exe"
                wrote+=("opi-$V-windows-x64${suffix}-setup.exe")
                ;;
              opi-packages)
                deb="$(find "$d" -name '*.deb' | head -1)"
                rpm="$(find "$d" -name '*.rpm' | head -1)"
                [ -n "$deb" ] || continue
                tier=normal
                case "$deb" in
                  *-full.deb) tier=full ;;
                  *-basic.deb) tier=basic ;;
                  *)
                    # 新构建：normal 的包名没有 -full/-basic 后缀，直接判 normal。
                    # （dpkg-deb 在部分 runner 上解 zstd 会失败，不能拿它当唯一判据。）
                    tier=normal
                    ;;
                esac
                suffix=""; [ "$tier" = normal ] || suffix="-$tier"
                cp "$deb" "assets/opi-$V-linux-amd64${suffix}.deb"
                wrote+=("opi-$V-linux-amd64${suffix}.deb")
                if [ -n "$rpm" ]; then
                  cp "$rpm" "assets/opi-$V-linux-x86_64${suffix}.rpm"
                  wrote+=("opi-$V-linux-x86_64${suffix}.rpm")
                fi
                ;;
              opi-ios-keyboard-*)
                ipa="$(find "$d" -name '*.ipa' | head -1)"
                if [ -n "$ipa" ]; then
                  cp "$ipa" "assets/opi-$V-ios-unsigned.ipa"
                  wrote+=("opi-$V-ios-unsigned.ipa")
                fi
                ;;
              opi-macos-ime-*)
                pkg="$(find "$d" -name '*.pkg' | head -1)"
                if [ -n "$pkg" ]; then
                  cp "$pkg" "assets/opi-$V-macos-universal.pkg"
                  wrote+=("opi-$V-macos-universal.pkg")
                fi
                ;;
              opi-harmony*)
                hap="$(find "$d" -name '*.hap' | head -1)"
                if [ -n "$hap" ]; then
                  cp "$hap" "assets/opi-$V-harmonyos-unsigned.hap"
                  wrote+=("opi-$V-harmonyos-unsigned.hap")
                fi
                ;;
              opi-asr-engine-*)
                # $d/a.zip 是 gh api 下载的 artifact 外壳，真正的组件是解压出来的 zip。
                zip="$(find "$d" -name '*.zip' ! -name 'a.zip' | head -1)"
                if [ -n "$zip" ]; then
                  cp "$zip" "assets/$(basename "$zip")"
                  wrote+=("$(basename "$zip")")
                fi
                ;;
            esac
          done < work/artifacts.tsv
          # 每个发布文件名只允许被写一次：两个不同 artifact 名字撞到同一目标名时，
          # 后写的会静默覆盖前一个（例如旧版无后缀包与新档位包）。
          printf '%s\n' "${wrote[@]}" | sort | uniq -c
          dupes="$(printf '%s\n' "${wrote[@]}" | sort | uniq -d)"
          [ -z "$dupes" ] || { echo "::error::多个 artifact 落到同一发布文件名："; printf '%s\n' "$dupes"; exit 1; }
          [ "${#wrote[@]}" -gt 0 ] || { echo "::error::没有可上传的资产（检查 version/tag/cutoff 输入）"; exit 1; }
          ls -lh assets
          gh release upload "$TAG" assets/* --clobber
