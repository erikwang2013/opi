name: Android Release APK

# 只出 APK artifact，不附到 release（发包/签名是另一条线）。
# 触发路径按**真实构建输入**列：android/（含 rust_builder/cargokit）、shared/pet
# （构建期拷进 assets 的贴纸/GIF/映射表，srcDir 见 android/app/build.gradle.kts）、
# crates/（libopi_ffi.so）、Cargo.toml/lock。data/ 是生成期输入，产物已入库，
# 不进本 workflow —— 版本号/词库变了会同时改 android/ 或 assets，仍会触发。
on:
  workflow_dispatch:
    inputs:
      tier:
        description: '安装包档位（full 含两套模型，约 +588MB）'
        type: choice
        options: [normal, full, basic]
        default: normal
  push:
    branches: [main]
    paths:
      - 'android/**'
      - 'shared/**'
      - 'crates/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - '.github/workflows/android-release.yml'

permissions:
  contents: read

jobs:
  android-release:
    name: Android — release APK
    runs-on: ubuntu-latest
    env:
      TIER: ${{ inputs.tier || 'normal' }}
    steps:
      - uses: actions/checkout@v4

      # 与 ci.yml 的 android job 同一 JDK（AGP 9 / Gradle 9.1 需要 17+）。
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # cargokit 按 android-arm64/android-arm/android-x64 固定三个平台编译
      # （rust_builder/cargokit/gradle/plugin.gradle）。
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android

      # cargokit 的 run_build_tool.sh 自己跑 `dart pub get`，所以只需装 Dart SDK。
      - uses: dart-lang/setup-dart@v1

      # runner 预装 SDK，但 NDK 版本未必对；版本号必须与
      # android/app/build.gradle.kts 和 rust_builder/android/build.gradle 一致。
      - name: 安装 NDK 27.0.12077973 并导出 SDK 环境
        run: |
          set -e
          sdk="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-$HOME/Android/Sdk}}"
          sdkmanager="$sdk/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$sdkmanager" ]; then
            sdkmanager="$(find "$sdk/cmdline-tools" -maxdepth 3 -name sdkmanager -type f | sort -V | tail -1)"
          fi
          test -x "$sdkmanager" || { echo "::error::找不到 sdkmanager（ANDROID_HOME=$sdk）"; exit 1; }

          # 这里故意不设 pipefail：sdkmanager 先退出会让 yes 吃 SIGPIPE，
          # 137/141 会被误判成失败；要的是 sdkmanager 自己的退出码。
          yes | "$sdkmanager" --licenses > /dev/null
          "$sdkmanager" "ndk;27.0.12077973"

          echo "ANDROID_HOME=$sdk" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$sdk" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_HOME=$sdk/ndk/27.0.12077973" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_ROOT=$sdk/ndk/27.0.12077973" >> "$GITHUB_ENV"
          echo "NDK: $sdk/ndk/27.0.12077973"

      # 与 windows.yml 的 version job 同理：artifact 名用 Cargo.toml 的版本，
      # 所以必须先证明它与 APK 里真实的 versionName 一致，否则名字会撒谎。
      # 校验逻辑在 scripts/check-versions.sh（与 ci.yml 的 versions job 同一份）。
      - name: 版本一致性（全仓，Cargo.toml 单一真源）
        id: version
        shell: bash
        run: |
          set -euo pipefail
          ver="$(bash scripts/check-versions.sh)"
          echo "version=$ver" >> "$GITHUB_OUTPUT"

      # 完整包模型（仅 full）：源文件与校验值同 scripts/package-components.py / AsrModels.kt。
      - name: 下载完整包语音模型（仅 full）
        if: env.TIER == 'full'
        shell: bash
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/asr-bundle/asr"
          mkdir -p "$root/sensevoice" "$root/whisper-small.en" "$root/vad"
          sv=https://hf-mirror.com/csukuangfj/sherpa-onnx-sense-voice-zh-en-ja-ko-yue-2024-07-17/resolve/main
          wh=https://hf-mirror.com/csukuangfj/sherpa-onnx-whisper-small.en/resolve/main
          get() { curl -fL --retry 5 --retry-delay 3 --connect-timeout 30 "$1" -o "$2"; }
          get "$sv/model.int8.onnx" "$root/sensevoice/model.int8.onnx"
          get "$sv/tokens.txt" "$root/sensevoice/tokens.txt"
          get "$wh/small.en-encoder.int8.onnx" "$root/whisper-small.en/small.en-encoder.int8.onnx"
          get "$wh/small.en-decoder.int8.onnx" "$root/whisper-small.en/small.en-decoder.int8.onnx"
          get "$wh/small.en-tokens.txt" "$root/whisper-small.en/small.en-tokens.txt"
          get https://gh-proxy.com/https://github.com/k2-fsa/sherpa-onnx/releases/download/asr-models/silero_vad.onnx "$root/vad/silero_vad.onnx"
          cd "$root"
          sha256sum -c <<'SUM'
          c71f0ce00bec95b07744e116345e33d8cbbe08cef896382cf907bf4b51a2cd51  sensevoice/model.int8.onnx
          f449eb28dc567533d7fa59be34e2abca8784f771850c78a47fb731a31429a1dc  sensevoice/tokens.txt
          8bdac288f369aa94ee2194059238c465ed82ea9d47ee8fa4a8c0a891873e462f  whisper-small.en/small.en-encoder.int8.onnx
          710ccf890e10f3faa15f51ec346081a2723c9f3adb6e4da81c6573a5a6f877fb  whisper-small.en/small.en-decoder.int8.onnx
          306cd27f03c1a714eca7108e03d66b7dc042abe8c258b44c199a7ed9838dd930  whisper-small.en/small.en-tokens.txt
          9e2449e1087496d8d4caba907f23e0bd3f78d91fa552479bb9c23ac09cbb1fd6  vad/silero_vad.onnx
          SUM

      # release 用仓库内的社区签名密钥库（android/keystore/），产物可安装但不上市。
      - name: ./gradlew assembleRelease
        shell: bash
        run: |
          args=(-PopiPackageTier="$TIER")
          if [ "$TIER" = full ]; then
            args+=(-PopiAsrBundleDir="$RUNNER_TEMP/asr-bundle")
          fi
          ./gradlew "${args[@]}" assembleRelease --no-daemon
        working-directory: android

      # 核对 APK 里的真实 versionName 与三个 ABI，再按发布命名拷进 dist/。
      - name: 产物核对并按发布名归档
        shell: bash
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          apk=android/app/build/outputs/apk/release/app-release.apk
          [ -f "$apk" ] || { echo "::error::assembleRelease 成功但没有 $apk"; exit 1; }
          mkdir -p dist
          suffix=""
          case "$TIER" in full) suffix="-full";; basic) suffix="-basic";; esac
          out="dist/opi-${VERSION}-android-universal${suffix}.apk"
          cp "$apk" "$out"

          aapt2="$(find "$ANDROID_HOME/build-tools" -maxdepth 2 -name aapt2 -type f | sort -V | tail -1)"
          [ -n "$aapt2" ] || { echo "::error::找不到 aapt2"; exit 1; }
          badging="$("$aapt2" dump badging "$out")"
          grep -E "^(package|minSdkVersion|targetSdkVersion|native-code)" <<<"$badging"
          grep -qF "versionName='${VERSION}'" <<<"$badging"

          # 签名必须是仓库内社区密钥库那张证书。落到 debug 签名照样构建成功、也照样
          # 能装，只是用户永远无法覆盖升级 —— 所以在这里钉死指纹（值见
          # android/keystore/README.md）。
          apksigner="$(find "$ANDROID_HOME/build-tools" -maxdepth 2 -name apksigner -type f | sort -V | tail -1)"
          [ -n "$apksigner" ] || { echo "::error::找不到 apksigner"; exit 1; }
          certs="$("$apksigner" verify --print-certs "$out")"
          grep -qF "SHA-256 digest: 3fe2867ce790f5e472cf16381264eb69b2807c7e58256678a6cef70a3dcf00bf" <<<"$certs" || {
            echo "::error::APK 签名不是社区密钥库的证书："
            echo "$certs"
            exit 1
          }

          entries="$(unzip -Z1 "$out")"
          abis=(arm64-v8a armeabi-v7a x86_64)
          if [ "$TIER" = full ]; then abis=(arm64-v8a x86_64); fi
          for abi in "${abis[@]}"; do
            grep -qF "lib/$abi/libopi_ffi.so" <<<"$entries" || {
              echo "::error::APK 缺 $abi 的 libopi_ffi.so"
              exit 1
            }
          done
          if [ "$TIER" = full ]; then
            grep -qF "assets/asr/sensevoice/model.int8.onnx" <<<"$entries" || {
              echo "::error::完整包缺内置 SenseVoice 模型"; exit 1; }
            grep -qF "assets/asr/whisper-small.en/small.en-encoder.int8.onnx" <<<"$entries" || {
              echo "::error::完整包缺内置 Whisper 模型"; exit 1; }
          fi
          if [ "$TIER" = basic ]; then
            ! grep -qF "assets/trad.opid" <<<"$entries" || {
              echo "::error::基础包不应带 trad.opid"; exit 1; }
          fi
          if [ "$TIER" = full ]; then
            grep -qF "lib/arm64-v8a/libopi_asr_jni.so" <<<"$entries" || {
              echo "::error::完整包缺语音引擎原生库"; exit 1; }
          else
            ! grep -qE "lib/(arm64-v8a|x86_64)/libopi_asr(_jni)?\.so" <<<"$entries" || {
              echo "::error::普通/基础包不应带语音引擎原生库（应改为设置内下载）"; exit 1; }
            ! grep -qE "lib/(arm64-v8a|x86_64)/(libsherpa-onnx-c-api|libonnxruntime)\.so" <<<"$entries" || {
              echo "::error::普通/基础包不应带语音引擎依赖库"; exit 1; }
          fi
          ls -l "$out"

      - name: 打包语音引擎组件（供普通/基础包按需下载）
        shell: bash
        run: |
          args=(-PopiPackageTier="$TIER")
          if [ "$TIER" = full ]; then
            args+=(-PopiAsrBundleDir="$RUNNER_TEMP/asr-bundle")
          fi
          ./gradlew "${args[@]}" :app:packageAsrEngine --no-daemon
        working-directory: android

      - uses: actions/upload-artifact@v4
        with:
          name: opi-android-release-v${{ steps.version.outputs.version }}-${{ env.TIER }}
          path: dist/opi-*-android-universal*.apk
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        with:
          name: opi-asr-engine-android-v${{ steps.version.outputs.version }}
          path: android/app/build/outputs/asr-engine/*.zip
          if-no-files-found: error
