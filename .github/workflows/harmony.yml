name: HarmonyOS

# 为什么是 self-hosted：
# GitHub-hosted ubuntu 上没有 HarmonyOS Command Line Tools / SDK，也没有可靠的
# 非交互获取方式（Huawei 下载站需要登录并接受许可）。因此本 workflow 跑在
# 已装好工具链的自托管 runner 上，标签：[self-hosted, linux, harmony]。
# 工具链根目录可用仓库变量 HARMONY_CLI_HOME 覆盖（默认见下方 env）。
#
# 本 workflow 只产出 **unsigned HAP**。安装到设备前必须另行签名（见
# docs/install/harmony.md 的「签名」一节）。未注入任何签名 secret。

on:
  push:
    paths:
      - 'harmony/**'
      - 'crates/**'
      - 'shared/**'
      - '.github/workflows/harmony.yml'
  pull_request:
    paths:
      - 'harmony/**'
      - 'crates/**'
      - 'shared/**'
      - '.github/workflows/harmony.yml'
  workflow_dispatch:
    inputs:
      tier:
        description: '语音模型档位：normal 按需下载，full 随包'
        type: choice
        options: [normal, full]
        default: normal

permissions:
  contents: read

concurrency:
  group: harmony-${{ github.ref }}
  cancel-in-progress: true

env:
  HARMONY_CLI_HOME: ${{ vars.HARMONY_CLI_HOME || '/home/component/command-line-tools' }}
  CARGO_TERM_COLOR: always
  # push/PR 只跑 normal；full 由手动触发（下载并校验 240 MB 模型后再打包）。
  VOICE_TIER: ${{ inputs.tier || 'normal' }}

jobs:
  hap:
    name: assembleHap (unsigned, ${{ inputs.tier || 'normal' }})
    runs-on: [self-hosted, linux, harmony]
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify toolchain
        run: |
          set -euo pipefail
          test -x "$HARMONY_CLI_HOME/bin/hvigorw" || { echo "hvigorw not found under $HARMONY_CLI_HOME"; exit 1; }
          test -d "$HARMONY_CLI_HOME/sdk/default/openharmony" || { echo "SDK not found under $HARMONY_CLI_HOME"; exit 1; }
          "$HARMONY_CLI_HOME/bin/hvigorw" --version
          grep -q '"apiVersion": "19"' "$HARMONY_CLI_HOME/sdk/default/openharmony/ets/oh-uni-package.json"
          command -v cargo
          command -v rustup

      - name: Add HarmonyOS Rust target
        run: rustup target add aarch64-unknown-linux-ohos

      - name: Prepare dictionary rawfiles
        run: scripts/prepare_harmony_dicts.sh

      - name: Build native ASR engine and models
        run: |
          set -euo pipefail
          scripts/prepare_harmony_asr.sh "$VOICE_TIER"
          test -s harmony/entry/libs/arm64-v8a/libopi_asr.so
          test -s harmony/entry/libs/arm64-v8a/libsherpa-onnx-c-api.so
          test -s harmony/entry/libs/arm64-v8a/libonnxruntime.so
          case "$VOICE_TIER" in
            normal) test ! -e harmony/entry/src/main/resources/rawfile/asr ;;
            full) test -s harmony/entry/src/main/resources/rawfile/asr/manifest.json
                  test -s harmony/entry/src/main/resources/rawfile/asr/sensevoice/model.int8.onnx ;;
          esac

      - name: Build HAP
        run: |
          set -euo pipefail
          cd harmony
          "$HARMONY_CLI_HOME/bin/hvigorw" clean --no-daemon
          "$HARMONY_CLI_HOME/bin/hvigorw" assembleHap -p buildMode=release --no-daemon
          HAP=entry/build/default/outputs/default/entry-default-unsigned.hap
          test -s "$HAP" || { echo "HAP missing or empty: $HAP"; exit 1; }
          ls -l "$HAP"
          unzip -l "$HAP"
          unzip -l "$HAP" | grep -q 'libs/arm64-v8a/libopiime.so' || { echo "HAP is missing libopiime.so"; exit 1; }
          for lib in libopi_asr.so libsherpa-onnx-c-api.so libonnxruntime.so libc++_shared.so; do
            unzip -l "$HAP" | grep -q "libs/arm64-v8a/$lib" || { echo "HAP is missing $lib"; exit 1; }
          done
          for f in luna.opid stroke.opid wubi86.opid; do
            unzip -l "$HAP" | grep -q "resources/rawfile/$f" || { echo "HAP is missing rawfile/$f"; exit 1; }
          done
          if [ "$VOICE_TIER" = "full" ]; then
            for f in manifest.json sensevoice/model.int8.onnx sensevoice/tokens.txt vad/silero_vad.onnx; do
              unzip -l "$HAP" | grep -q "resources/rawfile/asr/$f" || { echo "HAP is missing asr/$f"; exit 1; }
            done
          else
            if unzip -l "$HAP" | grep -q 'resources/rawfile/asr/'; then
              echo "normal HAP must not bundle ASR models"; exit 1
            fi
          fi

      - name: Upload unsigned HAP
        uses: actions/upload-artifact@v4
        with:
          name: opi-harmony-unsigned-${{ inputs.tier || 'normal' }}
          path: harmony/entry/build/default/outputs/default/entry-default-unsigned.hap
          if-no-files-found: error
          retention-days: 14
