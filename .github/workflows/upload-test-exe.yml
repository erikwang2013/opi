name: Upload test EXE

# 一次性工具：把指定 workflow artifact 里的 EXE 以 -test 名字挂到 v1.31.12，
# 让 Windows 真机能直接下载验证。验证完删除本文件。
on:
  workflow_dispatch:
    inputs:
      artifact_id:
        description: 'opi-windows-exe artifact ID'
        required: true
        type: string

permissions:
  contents: write
  actions: read

jobs:
  upload:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download artifact and upload as release test asset
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACT_ID: ${{ inputs.artifact_id }}
        run: |
          set -euo pipefail
          mkdir -p x
          gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$ARTIFACT_ID/zip" > a.zip
          unzip -q a.zip -d x
          exe="$(find x -name '*.exe' | head -1)"
          [ -n "$exe" ] || { echo "::error::artifact 里没有 exe"; exit 1; }
          cp "$exe" opi-1.31.12-windows-x64-setup-test.exe
          gh release upload v1.31.12 opi-1.31.12-windows-x64-setup-test.exe --clobber
