# SPDX-FileCopyrightText: 2026 erik.xyz
# SPDX-License-Identifier: MIT
#
# Apple 两平台（iOS / macOS）的**自动打包**。
#
# 为什么要有这条 workflow：`ios/`（8 个 .swift）与 `macos/`（3 个 .swift）从写下到今天
# **没有被任何编译器看过** —— 两边的 README 自称「起点 + 契约，不是可用实现」。
# CI 里唯一相关的那条（`ci.yml` 的 `cargo check -p opi_ffi` 四个 Apple 目标）只证明
# **Rust 侧**能为这些目标编译；它**不**证明 Swift 能编，更**不**证明两边能链接到一起。
# 本仓库已经因为「没被编译器看过的代码」栽过两次（fcitx5 C++ 首编 7 处 API 误写、
# Windows TSF 文本插入从未实现），所以这里把缺的那一步补上，并把产物发出来：
#
#   rust  job：四个 Apple 目标的 cdylib/staticlib → darwin 通用库 + iOS xcframework
#   macos job：`macos/` 真编译 → IME bundle（ad-hoc 签名）→ 只出一个 .pkg
#              （.app / pkgroot 是构建中间物，打包脚本结尾清掉）
#   ios   job：`ios/` 真编译 → 宿主 App + 键盘扩展 → unsigned IPA（**未签名**）
#
# ⚠️ 关于「未签名」：本仓库**没有** Apple 开发者证书，也不连任何签名服务，所以
# 产物只能 ad-hoc 签名 —— **开发可用、不能分发**（Gatekeeper 会拦）。详见两个打包脚本
# 的头部注释（`scripts/apple/package-*.sh`），那里把「能做什么/不能做什么」逐条写明了。
#
# ⚠️ 触发方式：正式形态是 `workflow_dispatch` + 默认分支 push（path 过滤）。
# 当前 `branches` 里还带着迭代分支 `feat/apple-packaging` —— 这么写是**必需**的：
# 本仓约定（也是 GitHub 的平台规则）「workflow 必须先存在于默认分支才能手动 dispatch」，
# 而迭代期不许推 main，所以只能靠分支 push 触发 `.github/workflows/apple.yml` 的首次运行。
# **合并前把 `feat/apple-packaging` 从 branches 里删掉**（只删一个词，其余不动）。
on:
  workflow_dispatch:
    inputs:
      tier:
        description: 'Apple 语音模型档位（normal=按需下载；full=内置完整模型）'
        required: true
        default: normal
        type: choice
        options:
          - normal
          - full
  push:
    branches: [main]
    paths:
      - 'ios/**'
      - 'macos/**'
      - 'crates/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'scripts/apple/**'
      - '.github/workflows/apple.yml'

permissions:
  contents: read

# 同一 ref 只留最新一次（三个 job 共用这一组；新 push 顶掉旧构建）。
concurrency:
  group: apple-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    name: Rust 产物 — darwin 通用库 + iOS 静态库/xcframework
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      # macOS runner 上 clang / ar / lipo / xcodebuild 全是原生的，直接 `cargo build --target`
      # 即可。**不需要** Linux 上交叉编 Apple 目标时那套 `AR_aarch64_apple_darwin=ar`
      # 之类的前缀环境变量 —— 别从那边照抄过来（那边是「用 GNU 工具链产 Mach-O」的绕法，
      # 这里是原生工具链，绕法反而会指错工具）。
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin, x86_64-apple-darwin, aarch64-apple-ios, aarch64-apple-ios-sim

      - uses: Swatinem/rust-cache@v2

      # 版本号只有一个真源（Cargo.toml 的 [workspace.package] version），取法也只有一份
      # （scripts/apple/version.sh）。三个 job 各自取一次，是为了不让 job 之间多一条
      # 「谁先谁后」的依赖 —— 取法本身不重复实现。
      - name: 取版本号
        id: ver
        run: echo "v=$(bash scripts/apple/version.sh)" >> "$GITHUB_OUTPUT"

      - name: 编四个 Apple 目标（cdylib + staticlib）
        run: |
          set -euo pipefail
          for t in aarch64-apple-darwin x86_64-apple-darwin aarch64-apple-ios aarch64-apple-ios-sim; do
            echo "== $t =="
            cargo build --release -p opi_ffi --target "$t"
          done

      - name: lipo 通用库 + iOS xcframework
        run: |
          set -euo pipefail
          out=target/apple-rust
          mkdir -p "$out/macos" "$out/headers"
          # dylib 与 staticlib 都合成通用（两个 arch 都在）—— macOS 侧集成时按需选一份。
          lipo -create target/aarch64-apple-darwin/release/libopi_ffi.dylib \
                      target/x86_64-apple-darwin/release/libopi_ffi.dylib \
            -output "$out/macos/libopi_ffi.dylib"
          lipo -create target/aarch64-apple-darwin/release/libopi_ffi.a \
                      target/x86_64-apple-darwin/release/libopi_ffi.a \
            -output "$out/macos/libopi_ffi.a"
          # install name 改成 @rpath 形式：cargo cdylib 常把**构建机上的绝对路径**写进
          # LC_ID_DYLIB，而任何用它链接的产物都会把那个路径抄进加载命令 —— 在别人机器上
          # 就是 `dyld: Library not loaded`，且在 CI 里全绿（路径存在）。发出去的库不该带这种地雷。
          install_name_tool -id @rpath/libopi_ffi.dylib "$out/macos/libopi_ffi.dylib"
          otool -D "$out/macos/libopi_ffi.dylib"
          # 通用性当场断言：lipo 少一片时**不报错**（它只会合成能合的那些），
          # 产物名却仍叫 libopi_ffi.dylib —— 那就是「名字说通用、内容不通用」。
          for f in "$out/macos/libopi_ffi.dylib" "$out/macos/libopi_ffi.a"; do
            info="$(lipo -info "$f")"
            echo "$info"
            case "$info" in
              *x86_64*arm64*|*arm64*x86_64*) ;;
              *) echo "!! $f 不是通用库：$info"; exit 1 ;;
            esac
          done
          # xcframework 里给的是**静态库**：iOS 扩展不允许带第三方 dylib。
          # 头单独拷一份 —— `-headers` 收的是目录，别把 macos/ 整个塞进去（那会把
          # opi.tiff、README.md 一起卷进 Headers/ 发出去）。
          # rust-cache 会连 target/apple-rust 一起恢复；上次成功留下的 xcframework
          # 会让 create-xcframework 报「item with the same name already exists」。
          rm -rf "$out/opi_ffi.xcframework"
          cp macos/OpiFFI.h "$out/headers/"
          xcodebuild -create-xcframework \
            -library target/aarch64-apple-ios/release/libopi_ffi.a -headers "$out/headers" \
            -library target/aarch64-apple-ios-sim/release/libopi_ffi.a -headers "$out/headers" \
            -output "$out/opi_ffi.xcframework"
          find "$out" -type f | sort

      # if-no-files-found: error 是**必需**的：默认只 warn，于是「跑绿了但一个文件都没上传」
      # 与「真的没产物」在 UI 上长得一样 —— 本仓对这类假绿记过账（绿了但没产物比红更坏）。
      - uses: actions/upload-artifact@v4
        with:
          name: opi-apple-rust-v${{ steps.ver.outputs.v }}
          path: target/apple-rust
          if-no-files-found: error

  macos:
    name: macOS — Swift 真编译 + IME bundle + 未签名 pkg
    runs-on: macos-latest
    env:
      # push 触发没有 input，默认 normal；workflow_dispatch 与 iOS 共用 tier 输入。
      OPI_MACOS_TIER: ${{ github.event.inputs.tier || 'normal' }}
      MACOSX_DEPLOYMENT_TARGET: '11.0'
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin, x86_64-apple-darwin

      - uses: Swatinem/rust-cache@v2
        with:
          # sherpa-rs 的构建产物引用 ~/Library/Caches/sherpa-rs 下的 dylib；
          # 只缓存 target 会出现「缓存命中但库文件不存在」，链接时找不到
          # onnxruntime（2026-11-02 Apple CI）。
          cache-directories: ~/Library/Caches/sherpa-rs
          key: sherpa-apple-v1

      - name: 取版本号
        id: ver
        run: echo "v=$(bash scripts/apple/version.sh)" >> "$GITHUB_OUTPUT"

      - name: 编 Rust 通用库的两个切片（含 macOS 语音）
        run: |
          set -euo pipefail
          cargo build --release -p opi_ffi --target aarch64-apple-darwin
          cargo build --release -p opi_ffi --target x86_64-apple-darwin
          # 语音：sherpa-rs 在 macOS 动态链接，两个 arch 的 .dylib 由脚本 lipo。
          cargo build --release -p opi-asr --target aarch64-apple-darwin
          cargo build --release -p opi-asr --target x86_64-apple-darwin

      - name: 下载完整包语音模型（仅 full 档）
        if: env.OPI_MACOS_TIER == 'full'
        run: |
          set -euo pipefail
          root=desktop/asr-bundle/asr
          base=https://opi.erik.xyz/download/components/asr
          files=(
            "sensevoice/model.int8.onnx c71f0ce00bec95b07744e116345e33d8cbbe08cef896382cf907bf4b51a2cd51"
            "sensevoice/tokens.txt f449eb28dc567533d7fa59be34e2abca8784f771850c78a47fb731a31429a1dc"
            "whisper-small.en/small.en-encoder.int8.onnx 8bdac288f369aa94ee2194059238c465ed82ea9d47ee8fa4a8c0a891873e462f"
            "whisper-small.en/small.en-decoder.int8.onnx 710ccf890e10f3faa15f51ec346081a2723c9f3adb6e4da81c6573a5a6f877fb"
            "whisper-small.en/small.en-tokens.txt 306cd27f03c1a714eca7108e03d66b7dc042abe8c258b44c199a7ed9838dd930"
            "vad/silero_vad.onnx 9e2449e1087496d8d4caba907f23e0bd3f78d91fa552479bb9c23ac09cbb1fd6"
          )
          for entry in "${files[@]}"; do
            rel="${entry%% *}"; want="${entry##* }"
            mkdir -p "$root/$(dirname "$rel")"
            echo "== 下载 $rel =="
            curl -fL --retry 3 --retry-delay 2 -o "$root/$rel" "$base/$rel"
            got="$(shasum -a 256 "$root/$rel" | awk '{print $1}')"
            [ "$got" = "$want" ] || { echo "!! $rel SHA-256 不符" >&2; exit 1; }
          done

      # 编译 + 组装 + 签名 + 打包全在脚本里：这类多行步骤写进 YAML 会立刻撞上本仓那条
      # 「run 块里不能有 heredoc」的限制（块状 YAML 的 heredoc 结束符必须在行首），
      # 于是要么把脚本挤成一行、要么躲开 shellcheck —— 两边都是坑。放脚本里还能本机跑。
      - name: 组装 IME bundle + ad-hoc 签名 + .pkg
        run: bash scripts/apple/package-macos.sh "${{ steps.ver.outputs.v }}"

      - name: 验证 pkg 结构与语音运行库（未签名）
        run: |
          set -euo pipefail
          pkg="$(ls dist/apple/macos/*.pkg)"
          pkgutil --payload-files "$pkg" > /tmp/opi-macos-payload.txt
          cat /tmp/opi-macos-payload.txt
          grep -q 'OpiInputMethod.app/Contents/MacOS/OpiInputMethod' /tmp/opi-macos-payload.txt
          grep -q 'OpiInputMethod.app/Contents/Frameworks/libopi_ffi.dylib' /tmp/opi-macos-payload.txt
          grep -q 'OpiInputMethod.app/Contents/Frameworks/libopi_asr.dylib' /tmp/opi-macos-payload.txt
          grep -Eq 'OpiInputMethod\.app/Contents/Frameworks/libsherpa-onnx[^/]*\.dylib' /tmp/opi-macos-payload.txt
          grep -Eq 'OpiInputMethod\.app/Contents/Frameworks/libonnxruntime[^/]*\.dylib' /tmp/opi-macos-payload.txt
          if [ "$OPI_MACOS_TIER" = full ]; then
            for rel in \
              asr/sensevoice/model.int8.onnx asr/sensevoice/tokens.txt asr/sensevoice/manifest.json \
              asr/whisper-small.en/small.en-encoder.int8.onnx \
              asr/whisper-small.en/small.en-decoder.int8.onnx \
              asr/whisper-small.en/small.en-tokens.txt \
              asr/whisper-small.en/manifest.json asr/vad/silero_vad.onnx; do
              grep -qF "OpiInputMethod.app/Contents/Resources/$rel" /tmp/opi-macos-payload.txt || {
                echo "!! full 档 pkg 缺少 Resources/$rel" >&2; exit 1; }
            done
          elif grep -qF 'OpiInputMethod.app/Contents/Resources/asr/' /tmp/opi-macos-payload.txt; then
            echo "!! normal 档 pkg 不应包含 Resources/asr/" >&2; exit 1
          fi
          echo "pkg 结构自洽：${pkg}（档位 ${OPI_MACOS_TIER}）"

      - uses: actions/upload-artifact@v4
        with:
          name: opi-macos-ime-v${{ steps.ver.outputs.v }}
          # 用户 2026-10-21 裁决：macOS 只发一个可安装的 .pkg，不要 .app/.zip 等额外文件。
          path: dist/apple/macos/*.pkg
          if-no-files-found: error

  ios:
    name: iOS — Swift 真编译 + 宿主 App/unsigned IPA
    runs-on: macos-latest
    env:
      # push 触发没有 input，默认 normal；workflow_dispatch 可选 full。
      OPI_IOS_TIER: ${{ github.event.inputs.tier || 'normal' }}
      # sherpa-onnx 预编译对象要求 iOS 13+；不设它时 cc/rustc 默认 10.0，
      # 链接会缺 ___chkstk_darwin（2026-11-02 Apple CI）。
      IPHONEOS_DEPLOYMENT_TARGET: '15.0'
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios, aarch64-apple-ios-sim

      - uses: Swatinem/rust-cache@v2
        with:
          cache-directories: ~/Library/Caches/sherpa-rs
          key: sherpa-apple-v1

      - name: 取版本号
        id: ver
        run: echo "v=$(bash scripts/apple/version.sh)" >> "$GITHUB_OUTPUT"

      - name: 编 Rust iOS 静态库（device + simulator）
        run: |
          set -euo pipefail
          cargo build --release -p opi_ffi --target aarch64-apple-ios
          cargo build --release -p opi_ffi --target aarch64-apple-ios-sim
          # 宿主语音用；sherpa-rs 的 iOS 预编译包是静态库（见 package-ios.sh 头注释）。
          # rustc 的 aarch64-apple-ios 默认部署目标 10.0，而 sherpa 对象是 13.0；
          # 不显式抬到 15.0 会在 ___chkstk_darwin 上链接失败。
          RUSTFLAGS="-C link-arg=-mios-version-min=15.0" \
            cargo build --release -p opi-asr --target aarch64-apple-ios

      - name: 下载完整包语音模型（仅 full 档）
        if: env.OPI_IOS_TIER == 'full'
        run: |
          set -euo pipefail
          root=desktop/asr-bundle/asr
          base=https://opi.erik.xyz/download/components/asr
          files=(
            "sensevoice/model.int8.onnx c71f0ce00bec95b07744e116345e33d8cbbe08cef896382cf907bf4b51a2cd51"
            "sensevoice/tokens.txt f449eb28dc567533d7fa59be34e2abca8784f771850c78a47fb731a31429a1dc"
            "whisper-small.en/small.en-encoder.int8.onnx 8bdac288f369aa94ee2194059238c465ed82ea9d47ee8fa4a8c0a891873e462f"
            "whisper-small.en/small.en-decoder.int8.onnx 710ccf890e10f3faa15f51ec346081a2723c9f3adb6e4da81c6573a5a6f877fb"
            "whisper-small.en/small.en-tokens.txt 306cd27f03c1a714eca7108e03d66b7dc042abe8c258b44c199a7ed9838dd930"
            "vad/silero_vad.onnx 9e2449e1087496d8d4caba907f23e0bd3f78d91fa552479bb9c23ac09cbb1fd6"
          )
          for entry in "${files[@]}"; do
            rel="${entry%% *}"; want="${entry##* }"
            mkdir -p "$root/$(dirname "$rel")"
            echo "== 下载 $rel =="
            curl -fL --retry 3 --retry-delay 2 -o "$root/$rel" "$base/$rel"
            got="$(shasum -a 256 "$root/$rel" | awk '{print $1}')"
            [ "$got" = "$want" ] || { echo "!! $rel SHA-256 不符" >&2; exit 1; }
          done

      - name: 编译扩展 + 宿主 App + 组装 unsigned IPA
        run: bash scripts/apple/package-ios.sh "${{ steps.ver.outputs.v }}"

      - name: 验证 IPA 结构（未签名）
        run: |
          set -euo pipefail
          ipa="$(ls dist/apple/ios/*.ipa)"
          unzip -l "$ipa" > /tmp/opi-ipa-list.txt
          cat /tmp/opi-ipa-list.txt
          for member in \
            'Payload/Opi.app/Opi' \
            'Payload/Opi.app/PlugIns/OpiKeyboard.appex/OPIKeyboard' \
            'Payload/Opi.app/PlugIns/OpiKeyboard.appex/luna.opid' \
            'Payload/Opi.app/PlugIns/OpiKeyboard.appex/trad.opid' \
            'Payload/Opi.app/PlugIns/OpiKeyboard.appex/stroke.opid' \
            'Payload/Opi.app/PlugIns/OpiKeyboard.appex/wubi86.opid' \
            'Payload/Opi.app/PlugIns/OpiKeyboard.appex/rare_index.tsv'; do
            grep -qF "$member" /tmp/opi-ipa-list.txt || {
              echo "!! IPA 缺少 $member" >&2
              exit 1
            }
          done
          # 中间产物已由脚本清理，plist 校验从 IPA 内解出来做。
          tmp="$(mktemp -d)"
          trap 'rm -rf "$tmp"' EXIT
          unzip -q "$ipa" -d "$tmp"
          app="$tmp/Payload/Opi.app"
          plutil -lint "$app/Info.plist"
          plutil -lint "$app/PlugIns/OpiKeyboard.appex/Info.plist"
          host_id="$(plutil -extract CFBundleIdentifier raw "$app/Info.plist")"
          kb_id="$(plutil -extract CFBundleIdentifier raw "$app/PlugIns/OpiKeyboard.appex/Info.plist")"
          case "$kb_id" in "$host_id".*) ;; *) echo "扩展 id 不以宿主 id 为前缀: $kb_id / $host_id" >&2; exit 1;; esac
          mic="$(plutil -extract NSMicrophoneUsageDescription raw "$app/Info.plist")"
          [ -n "$mic" ] || { echo "!! 宿主 Info.plist 缺麦克风用途说明" >&2; exit 1; }
          scheme="$(plutil -extract CFBundleURLTypes.0.CFBundleURLSchemes.0 raw "$app/Info.plist")"
          [ "$scheme" = "opi-voice" ] || { echo "!! 宿主 URL scheme 不是 opi-voice: $scheme" >&2; exit 1; }
          if [ "$OPI_IOS_TIER" = full ]; then
            for member in \
              'Payload/Opi.app/asr/sensevoice/model.int8.onnx' \
              'Payload/Opi.app/asr/sensevoice/tokens.txt' \
              'Payload/Opi.app/asr/sensevoice/manifest.json' \
              'Payload/Opi.app/asr/whisper-small.en/small.en-encoder.int8.onnx' \
              'Payload/Opi.app/asr/whisper-small.en/small.en-decoder.int8.onnx' \
              'Payload/Opi.app/asr/whisper-small.en/small.en-tokens.txt' \
              'Payload/Opi.app/asr/whisper-small.en/manifest.json' \
              'Payload/Opi.app/asr/vad/silero_vad.onnx'; do
              grep -qF "$member" /tmp/opi-ipa-list.txt || {
                echo "!! full 档 IPA 缺少 $member" >&2; exit 1; }
            done
          elif grep -qF 'Payload/Opi.app/asr/' /tmp/opi-ipa-list.txt; then
            echo "!! normal 档 IPA 不应包含 asr/ 模型" >&2; exit 1
          fi
          echo "IPA 结构自洽：${ipa}（未授权/未签名，需重签后安装；档位 ${OPI_IOS_TIER}）"

      - uses: actions/upload-artifact@v4
        with:
          name: opi-ios-keyboard-v${{ steps.ver.outputs.v }}
          # 用户 2026-10-21 裁决：iOS 只发一个可安装的 IPA，不要 xcframework/plist/zip。
          # 中间产物由 package-ios.sh 在临时目录构建并在退出时清理。
          path: dist/apple/ios/*.ipa
          if-no-files-found: error
