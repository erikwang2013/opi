name: Packages

# 打包 .deb / .rpm。**只在手动触发时跑** —— 发版不再自动构建，也不会自动附到 release 上。
#
# --- 为什么改成手动（2026-09-28）--------------------------------------------
# 原先挂着 `on: release: types: [published]`：发一个 release 就会在**无人过目**的情况下
# 顺手把 .deb/.rpm 挂上去。用户要的是对发版产物的控制权 —— 想打的时候自己打，想附的时候
# 自己附。所以改的是**触发方式**，不是打包本身：脚本、debian:12 容器基座、符号版本
# 守卫**一条没动**，下面那些注释里的结论一条没变，手动跑一次照样全绿。
#
# ⚠️ 这次改动**不是**因为发现了包本身的缺陷。「deb 在 deepin 装完没反应」已查明是没把
#    OPI 加进 fcitx5 的输入法组（新装的输入法不会自动启用），包没问题 —— 别把这次改动
#    读成对包的否定。
#
# --- 手动怎么跑 --------------------------------------------------------------
#   gh workflow run packages.yml --ref <tag 或分支>   # 想打哪个提交就 --ref 哪个
#   或 Actions 页面 → Packages → Run workflow（同样能选 ref）。可选输入项见下面 on.inputs。
#   产物在本次 run 的 artifact `opi-packages` 里；只有填了 tag 输入项才会顺带附到 release。
#   ⚠️ 附之前自己对一遍版本号：拿默认分支编出来的包去附一个旧 tag，gh 不会拦
#      （文件名里的版本和 tag 不一致它照传，附上去也看不出来）。要附哪个 tag 就 --ref 哪个。
#
# 为什么单独一个 workflow（而不是塞进 ci.yml 的 fcitx5 job）：
#   ci.yml 只**验**落点（装到暂存树，再问真 fcitx5 库「你去哪找」）。打包是另一件事 ——
#   它要 nfpm、要两个格式各自的库目录布局。两条通路的失败含义不同，不该互相拖累。
#
# ⚠️ 手动跑的两个前提（别再靠印象）：
#   1) 这个 workflow 必须存在于**默认分支**上才可被 dispatch —— 只在某个分支/tag 上有它，
#      Actions 列表里根本看不到它，`gh workflow run` 也找不到。
#   2) 本次 run 的 ref 就是你 --ref 选的那个，checkout 落在它上面（可能是个 tag ⇒ detached
#      HEAD）。所以 scripts/build-packages.sh 与 scripts/nfpm.yaml 必须在**你 ref 到的那个
#      提交**里 —— 拿一个脚本还没入库的旧 tag 当 ref 去跑，会在「找不到脚本」上红。
#      （这个形态原先挂在 release 事件上，换手动后一样存在，只是现在红在你眼前而不是
#      发布之后。）
#   另外补一条**没写成断言**的（免得以后有人当事实用）：dispatch 一个 ref 时执行的到底是
#   「选中 ref 的 YAML」还是「默认分支的 YAML」，网上两种互斥的实测记录都有，本机核不实 ——
#   所以全文不拿它做任何判断。（两条路的安全后果一样：旧 tag 那份的挂载步也是按事件名
#   判的，dispatch 时同样不挂。）
#
# ==========================================================================
# 构建**在 debian:12 容器里**做，不在 runner 上。这不是洁癖，是 v1.3.2 的事故换来的：
#
#   现象：包在 Debian 12 / Ubuntu 22.04 / Mint 21 上装得上，插件却加载不了 ——
#         `Error: /lib/x86_64-linux-gnu/libstdc++.so.6: version GLIBCXX_3.4.32 not found
#          (required by .../libfcitx5_opi_glue.so)`。
#   根因：.so 在 runner（ubuntu-latest，较新 GCC）上编，**链接时**就把 libstdc++ 的
#         符号版本要求绑到了 3.4.32；而 debian:12 的 libstdc++ 只提供到 3.4.30。
#         实测：v1.3.2 那份胶水 = 3.4.32，debian:12 = 3.4.30，宿主自编的那份只要
#         3.4.21。凡「产物在更新鲜的机器上编」都带这一类：不止 GLIBCXX，glibc 的
#         符号版本同理。
#   修法：在**目标最老的被测发行版**里编，整类问题一次消掉，且与声明的 fcitx5 5.0
#         下界自洽。**不选 -static-libstdc++** —— 那会让我们的 .so 与 fcitx5 各持一份
#         libstdc++，而异常/RTTI 要跨这个边界（fcitx5 的 API 抛异常、胶水在 FFI 边界
#         catch (const std::exception&)），是已知会出问题的形态。
#   附带：runner 上的 fcitx5 头是 5.1.7，而声明的门槛是 5.0 —— 在 debian:12 里编，
#         连「拿 5.1 的头编出要在 5.0 上跑的东西」这类不兼容也一并消掉（编译面另有一
#         道门禁，见 ci.yml 的同名容器步骤）。
#
# 光把构建搬进容器是**约定**，会漂（有人改回 runner、或换基座，都看不出来）。所以下面
# 还有一道**守卫**：从打出来的包里抽出那两个 .so，量它们的符号版本天花板
# （GLIBCXX_3.4.N / GLIBC_X.Y），与**本容器提供的那一份**逐对比较。守卫自带对照 ——
# 喂一个比本发行版更新的版本串必须红（否则「守卫绿」分不清是产物真好还是比较器瞎了），
# 与本发行版恰好相等必须通过（把 > 写成 >= 的实现会在这里红）。历史上那份真阳性样本
# （v1.3.2 的胶水：要 3.4.32 > 提供 3.4.30）本机拿来验过一次，见该轮的预演记录；CI 里
# 不去拉旧 release，用合成串做对照。
#
# 反面那一课（**在新机器上编的产物能不能在旧机器上加载**）由 ci.yml 的 fcitx5 job 守着：
# 它在 runner 上编、再拿到 debian:12 里真加载。那边红就说明这一类又回来了 —— 那是**故意**
# 留着的一道网，别把它改成「容器里编」。
on:
  # 只有手动。加回 `release: types: [published]` 就等于把「发版顺手出包」请回来 ——
  # 真要加，先想清楚是不是又想让产物在无人过目时出现在 release 上。
  workflow_dispatch:
    inputs:
      # 留空的默认路径是「只出 artifact、不碰任何 release」。要附 release 必须**手写**
      # 那个 tag —— 默认值是空串（见下面的 default），不从 ref 或事件里推一个出来，
      # 免得附到某个看起来对的 tag 上。
      tag:
        description: '要附产物的 release tag（留空 = 只出 artifact，不碰任何 release）'
        required: false
        type: string
        # 显式写出默认值，别让 `if: inputs.tag != ''` 押在「未提供的可选输入会取什么值」
        # 这条我没核实过的规则上。有了它，没填 ⇒ 确定是空串 ⇒ 那一步确定跳过。
        default: ''

# gh release upload 要写 release 上的资产 —— 只有末尾那一步、且只有手填了 tag 时才用到。
# 缺了它 gh 会以 403 失败，报错文本指向 token 而不是权限块，容易看错地方。
permissions:
  contents: write

jobs:
  packages:
    name: 打包 .deb / .rpm（debian:12 容器里构建）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # nfpm 是 Go 写的单二进制：**在外面装、挂进容器用**（容器里不装 Go、不拉模块）。
      - uses: actions/setup-go@v5
        with:
          go-version: 'stable'

      # ⚠️ 版本**钉住**，不用 @latest。原因不是洁癖：打包的正确性押在 nfpm 的
      # contents 语义上（脚本里记着 nfpm 2.47 不展开 contents.src 里的 ${...}，
      # 于是脚本自己 sed 出字面值）。@latest 会让「某天 nfpm 改了语义」变成
      # **静默打出一个错包**，而不是一次能看见的红。
      # v2.47.0 = 本机这套脚本实测过的那个版本（Go 模块缓存里的版本号即为它）。
      # 注意它的 go.mod 要求 go >= 1.26.4；上面 setup-go 取 stable，
      # 若 runner 的 stable 更低，Go 会按 GOTOOLCHAIN=auto 自己拉工具链，不会红。
      #
      # CGO_ENABLED=0 不能省：默认会长出一个**动态链接 glibc** 的二进制，那它就又会
      # 在 debian:12 里报 GLIBC_2.x not found —— 同一个坑换个位置再来一遍。置 0 得到
      # 静态二进制，挂进去就能跑（下面那句 file + 容器里的 nfpm --version 是取证点）。
      - name: 装 nfpm（钉 v2.47.0，静态）
        run: |
          set -euo pipefail
          CGO_ENABLED=0 go install github.com/goreleaser/nfpm/v2/cmd/nfpm@v2.47.0
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      # 整条构建链（cargo + cmake + nfpm）都在 debian:12 里跑，产物直接落在挂进来的
      # 工作区 dist/ 上，后面两步照旧（上传 artifact / 挂 release）。
      #
      # ⚠️ 这段容器脚本只能写成 `-c '…'`（YAML 块里每一行都带缩进，而 heredoc 的结束符
      # 必须在行首），代价是躲开了 shellcheck —— 所以它按 ci.yml 里同一套规矩办：**本条
      # 本机用 debian:12 逐字预演过**（见该轮预演记录：整条链跑通、守卫三个数都量到、
      # 阳性对照按预期红），改动后要重新预演。写法约束：单引号里不能再出现单引号；
      # 容器内要展开的 $ 保持原样，要**字面**传给容器内命令的 $ 才写 \$。
      - name: 在 debian:12 容器里构建 + 符号版本天花板守卫
        run: |
          set -euo pipefail
          nfpm_bin="$(command -v nfpm)"
          [ -n "$nfpm_bin" ] || { echo "::error::runner 上没有 nfpm（上一步没装上？）"; exit 1; }
          file "$nfpm_bin"
          timeout 1800 docker run --rm \
            -v "$PWD:/w" \
            -v "$nfpm_bin:/usr/local/bin/nfpm:ro" \
            debian:12 bash -euo pipefail -c '
          echo "== 容器: debian $(cat /etc/debian_version) / $(uname -m)"
          export DEBIAN_FRONTEND=noninteractive
          apt-get update -qq > /tmp/apt.log 2>&1 || { tail -20 /tmp/apt.log; exit 1; }
          # make 不能省：--no-install-recommends 的裸 debian:12 里没有它，缺了 cmake 会报
          # 「CMAKE_MAKE_PROGRAM is not set」，并把紧接着的一条报成 CXX 编译器缺失（实测，
          # 指向别处）。curl + ca-certificates 是 rustup 要的。
          apt-get install -y -qq --no-install-recommends \
            ca-certificates curl cmake make g++ \
            libfcitx5core-dev libfcitx5utils-dev libfcitx5config-dev >> /tmp/apt.log 2>&1 \
            || { tail -30 /tmp/apt.log; exit 1; }

          # 基座自检：这个容器存在的理由就是「最老的被测发行版」。它漂了，前提就变了。
          devver="$(dpkg-query -W -f="\${Version}" libfcitx5core-dev)"
          case "$devver" in
            5.0.*) ;;
            *) echo "::error::容器里的 libfcitx5core-dev 不是 5.0.x（$devver）——"
               echo "   换基座前先重新确认下界，别让它悄悄变成「随便哪个版本」。"
               exit 1 ;;
          esac
          echo "== fcitx5 头/库: $devver"

          # Rust 工具链装进容器（官方 rustc 以 glibc 2.17 为基线，能在 debian:12 上跑）。
          # 用 stable 而不钉某个版本：产物兼容性由下面的守卫**实测**，不靠工具链自律。
          curl --proto "=https" --tlsv1.2 -sSf https://sh.rustup.rs -o /tmp/rustup.sh \
            || { echo "::error::拉 rustup 失败"; exit 1; }
          sh /tmp/rustup.sh -y --profile minimal --default-toolchain stable --no-modify-path \
            > /tmp/rustup.log 2>&1 || { tail -30 /tmp/rustup.log; exit 1; }
          export PATH="$HOME/.cargo/bin:$PATH"
          cargo --version

          # nfpm 是挂进来的静态二进制（容器里不装 Go）—— 先证明它在**这个**发行版里跑得动。
          nfpm --version

          # 与本地同一个入口、同一个脚本，差别只在整条工具链都换成了 debian:12 的。
          cd /w
          OUT_DIR=/w/dist WORK_DIR=/tmp/opi-packages scripts/build-packages.sh

          # ---- 守卫：产物自带的符号版本要求必须 ≤ 本发行版提供的那一份 ----
          # 判据取自**打出来的 .deb 里那两份 .so**（不是构建树）：这样连「打包漏装/装错」
          # 也一起覆盖。.rpm 不再抽一遍 —— 两个格式是同一次构建的两棵暂存树，工具链与
          # 版本绑定完全相同，差别只在库目录名。
          chk="$(mktemp -d)"
          dpkg-deb -x /w/dist/opi_*.deb "$chk"
          glue="$(find "$chk" -name libfcitx5_opi_glue.so -print -quit)"
          rlib="$(find "$chk" -name libfcitx5_opi.so -print -quit)"
          [ -n "$glue" ] && [ -n "$rlib" ] || {
            echo "::error::包里没装到那两个 .so（胶水=$glue 引擎=$rlib）—— 先看上面 build-packages.sh 打的清单"
            exit 1
          }

          # 量「这根构件要求到哪一版」：取它引用的符号版本里最高的那一个。
          # sort -V 按段做数值比较（2.9 < 2.36），字符串排序会在这里读错。
          # ⚠️ 两个坑都在本机预演里现过形（都是这一版改掉的）：
          #   1) 只写 `GLIBCXX_3\.4\.[0-9]+` 会**漏掉只要求基底版 `GLIBCXX_3.4` 的构件** ——
          #      而那恰好就是在 debian:12 里编出来的那种（实测：容器编的胶水只要 GLIBCXX_3.4，
          #      runner 编的那份要 3.4.31/3.4.32）。所以正则收基底版：`GLIBCXX_3\.4(\.[0-9]+)?`。
          #   2) `grep` 没匹配到就退出 1，在 `set -o pipefail` 下会把整段**静默**杀掉（一个字
          #      的输出都没有，预演实测）。所以 grep 的失败要就地吃掉，输出为空这件事由下面的
          #      判据自己决定 —— 别交给 shell 悄悄处理。
          # 空值语义（想清楚再改）：**参照侧**量不出 = 容器坏了 ⇒ 红；**产物侧**量不出 = 这根
          # 构件根本不引用这一族符号版本 ⇒ 不算异常（但仍打印，免得「没在量」被读成「量了且过」）。
          ceiling() {  # $1=构件 $2=版本正则 $3=本发行版的参照库 $4=标签
            art="$( { grep -aoE "$2" "$1" || true; } | sort -uV | tail -1)"
            ref="$( { grep -aoE "$2" "$3" || true; } | sort -uV | tail -1)"
            [ -n "$ref" ] || {
              echo "::error::[守卫/$4] 参照库 $3 里量不出 $2 —— 容器本身不对，这道守卫的一切结论先别信"
              return 1
            }
            [ -n "$art" ] || {
              echo "[守卫/$4] 产物不引用这一族符号版本（$2）⇒ 按「没有要求」通过"
              return 0
            }
            if [ "$art" = "$ref" ] \
              || [ "$(printf "%s\n%s\n" "$art" "$ref" | sort -uV | tail -1)" = "$ref" ]; then
              echo "[守卫/$4] 通过：产物要求 $art ≤ 发行版提供 $ref"
            else
              echo "${CEIL_PREFIX-::error::}[守卫/$4] 红了：产物要求 $art，本发行版只提供 $ref —— 这个 .so 在目标系统上加载不了"
              return 1
            fi
          }

          # libstdc++ 的两族（GLIBCXX + CXXABI）都量：这两种在用户端是同一种故障
          # （`version CXXABI_1.3.13 not found`），只守一族等于留一半。
          # 换成新版 GCC 还可能走 `GCC_3.x`，但那族是 C 语言的运行支持、跨版本几乎不动。
          ceiling "$glue" "GLIBCXX_3\.4(\.[0-9]+)?" /lib/x86_64-linux-gnu/libstdc++.so.6 GLIBCXX
          ceiling "$glue" "CXXABI_[0-9.]+" /lib/x86_64-linux-gnu/libstdc++.so.6 CXXABI
          ceiling "$glue" "GLIBC_[0-9]+\.[0-9]+" /lib/x86_64-linux-gnu/libc.so.6 GLIBC-胶水
          ceiling "$rlib" "GLIBC_[0-9]+\.[0-9]+" /lib/x86_64-linux-gnu/libc.so.6 GLIBC-引擎

          # 边界对照：与本发行版**恰好相等**必须通过（写成 >= 的实现会在这里红）。
          eq="$( { grep -aoE "GLIBCXX_3\.4(\.[0-9]+)?" /lib/x86_64-linux-gnu/libstdc++.so.6 || true; } | sort -uV | tail -1)"
          printf "%s" "$eq" > /tmp/eq.so
          ceiling /tmp/eq.so "GLIBCXX_3\.4(\.[0-9]+)?" /lib/x86_64-linux-gnu/libstdc++.so.6 边界对照

          # 阳性对照（本段最后一条，不再往后的调用依赖 ::error:: 前缀）：喂一个要求
          # GLIBCXX_3.4.99 的构件，比较器必须判红。缺了它，「守卫绿」就分不清是产物真好
          # 还是比较器恒真 —— 那正是这一类门禁最容易变成的样子。
          printf "GLIBCXX_3.4.99" > /tmp/newer.so
          if CEIL_PREFIX="" ceiling /tmp/newer.so "GLIBCXX_3\.4(\.[0-9]+)?" \
               /lib/x86_64-linux-gnu/libstdc++.so.6 阳性对照; then
            echo "::error::阳性对照失败：要求 GLIBCXX_3.4.99 的构件被判通过 —— 这道守卫没有牙"
            exit 1
          fi
          echo "[守卫] 阳性对照按预期红了（它上面那行「红了」就是预期结果，不是故障）"
          '

      # 产物从这里取（现在这是唯一的取法）：手动跑完在本次 run 的 artifact 里。
      # 否则跑一次只能证明「它绿了」，拿不到包。
      # if-no-files-found: error —— 默认只 warn，而「绿了但没产物」正是本仓
      # 反复栽过的那种假绿。
      - uses: actions/upload-artifact@v4
        with:
          name: opi-packages
          if-no-files-found: error
          path: |
            dist/*.deb
            dist/*.rpm

      # 附到 release 是**显式选择**，不是默认动作：只有手填了上面的 tag 输入项才跑。
      # 留空时本步跳过 —— 不猜 tag、不碰任何 release，产物就停在上面的 artifact 里，
      # 挂不挂由人决定。所以这里**不该**有「从 GITHUB_REF_NAME 之类推一个 tag 出来」的回退。
      # tag 用 env 传、不在 run 里插值：少一处把外部字符串拼进 shell 的地方。
      # 用 --repo 显式给出仓库：checkout 的可能是个 tag（detached HEAD），别让 gh 去猜 remote。
      # --clobber：重跑这个 job 时覆盖同名资产（否则 gh 报「资产已存在」而红）。
      #   ⚠️ 它也意味着**同名的手工上传物会被静默替换** —— 这是要的，
      #   但别在该版本已经手工传过包的情况下当成「只是补一个文件」。
      - name: 附到 release（仅当手填了 tag 输入项）
        if: inputs.tag != ''
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
        run: |
          gh release upload "$TAG" dist/*.deb dist/*.rpm \
            --repo "$GITHUB_REPOSITORY" --clobber
