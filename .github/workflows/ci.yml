name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  rust:
    name: Rust — fmt + test + clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # targets 里带上 Windows 与 Apple 目标：TSF 代码在 #[cfg(target_os = "windows")] 下，
      # 而 ios/ 与 macos/ 的 Swift 草案**本仓库无法编译**（需 macOS + Xcode）——
      # 于是在 Linux 上唯一能守住「C ABI 仍为 Apple 目标编译得过」的手段就是这几条 check。
      # 缺了它们，Apple 侧的下场就是 fcitx5 C++ 与 TSF 那两次：写完了、读起来像完成、
      # 实测却发现从未被编译器看过。
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
          targets: x86_64-pc-windows-msvc, aarch64-apple-ios, aarch64-apple-ios-sim, aarch64-apple-darwin, x86_64-apple-darwin

      # 放最前面：最便宜，错了也最容易看懂。
      # 这条是补上的 —— 此前仓库**从来没有** fmt 门禁，于是漂移只增不减，
      # 到 2026-09-27 已累积 212 处（HEAD 上就有 173 处，早于当时的任何改动）。
      # 一次性格式化（commit fbdb9e7）之后加门禁，防止它再长回来。
      - name: cargo fmt --all --check
        run: cargo fmt --all --check

      # --no-fail-fast：缺了它，cargo 在**第一个失败的 test target** 上就停，
      # 其余 target 根本不跑。于是 CI 只告诉你「第一个失败的 binary」，
      # 而 CI 存在的意义是让人**一次看全**。（实测：一个变异下带 flag 报
      # 「error: 4 targets failed」，不带则只报 engine-core --lib 就停。）
      # 退出码两边都是非零（实测 101）—— 这不是「假通过」，是「报不全」。
      - name: cargo test --workspace --no-fail-fast
        run: cargo test --workspace --no-fail-fast

      - name: cargo clippy --workspace --all-targets -- -D warnings
        run: cargo clippy --workspace --all-targets -- -D warnings

      # ---- 两条**消费者/宿主侧**门禁，此前都不在 CI 里 ----
      #
      # 1) crates/opi-ffi/tests/c_abi/run.sh —— 全仓唯一**真编译 macos/OpiFFI.h**
      #    的地方。`cargo test` 里的 ABI 测试是 Rust 调 extern "C" fn：那验的是
      #    「Rust 以为的 ABI」，头文件写成什么样都照样绿。
      # 2) android/jni_smoke —— JNI 侧**唯一的函数体取证点**。RegisterNatives
      #    成功只证明「名字+描述符」对得上，不证明函数体对（把 unwrap_or(false)
      #    写成 unwrap_or(true) 照样注册成功）。它不需要 Android：主 JVM 上
      #    System.load 即可。
      #
      # 两条都用下面这份 release cdylib，所以先显式建出来（run.sh 自己也会建，
      # 这里是让它和 JNI 那步共用同一份产物，而不是谁搭谁的便车）。
      - name: cargo build -p opi_ffi --release（供下面两条消费者门禁）
        run: cargo build -p opi_ffi --release

      - name: C 消费者：真编译 macos/OpiFFI.h + 真调导出
        run: |
          set -euo pipefail
          # run.sh 用 clang。缺了它报错会埋在编译输出里，先说清楚。
          command -v clang >/dev/null || {
            echo "!! runner 上没有 clang（本步依赖 ubuntu-latest 预装）"; exit 1; }
          bash crates/opi-ffi/tests/c_abi/run.sh android/app/src/main/assets/luna.opid

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: JNI smoke（android/jni_smoke，主 JVM 上 System.load）
        run: |
          set -euo pipefail
          javac -d /tmp/jni-smoke android/jni_smoke/Main.java
          java -Dopi.so="$PWD/target/release/libopi_ffi.so" -cp /tmp/jni-smoke \
            io.opi.input.jni.Main android/app/src/main/assets/luna.opid

      # cargo check 不链接，所以 Linux 上无需 msvc 链接器即可跑通。
      - name: cargo check -p tsf_opi (x86_64-pc-windows-msvc)
        run: cargo check -p tsf_opi --target x86_64-pc-windows-msvc

      # 同理：check 不链接，Linux runner 上无需 Apple SDK。
      # 这守的是「C ABI 还能为 Apple 目标编译」—— 它**不**证明能链接成 .a/.framework，
      # 更**不**证明 ios/ 与 macos/ 的 Swift 能编译（那需要 macOS + Xcode）。
      - name: cargo check -p opi_ffi (Apple 目标)
        run: |
          for t in aarch64-apple-ios aarch64-apple-ios-sim aarch64-apple-darwin x86_64-apple-darwin; do
            echo "== $t =="
            cargo check -p opi_ffi --target "$t"
          done

  # ---- MSRV 的**执行点** ----
  #
  # Cargo.toml 里那句 `rust-version` 是**声明**，而上面每个 Rust 步骤都跑在 @stable
  # 上 —— 于是「声明」与「真的能编」之间没有任何执行点，两个方向都漏：
  #   · 真用了晚于声明的 API/语法而声明没跟上 → 按 rust-version 挑工具链的人编不过，
  #     而 CI 全绿（stable 编得过）；
  #   · 有人把声明**往下调** → 也不会有人红（下界的来源见 Cargo.toml 的注释，别在此再抄）。
  # 加了这个 job，改 rust-version 与「在那个版本上编不过」之间才有判据。
  #
  # ⚠️ 工具链**从声明推导**（下一步那个 `sed`），不写死版本号 —— 写死就是又造一份
  # 会漂的真源，而且只堵得住上面第一条。注意 clippy 的 incompatible_msrv（跟着
  # rust-version 声明打开，在 rust job 的 -D warnings 下即 deny）查的是**它认识的
  # 那张 std API 表**，管不了语言特性（本仓卡下界的是 `if let … && …` 那个 let-chain，
  # 它就表外）。所以「声明被下调」这条路只能靠这里堵。
  #
  # ⚠️ 两条 cargo 参数都是必需的，不是保险：
  #   --all-targets：不带它，dev-deps 与 #[cfg(test)] 里的代码根本不编，
  #                  而 test-only 的 API 同样在拉高下限 —— 漏了它只守得住一半。
  #   --locked：不带它，cargo 会**静默改写** Cargo.lock 再据此编译，于是测的不是
  #             锁定那份依赖。MSRV 最常见的顶破方式就是依赖升级。
  #
  # 工具链是按 job 装的，所以这个 job 必须**单独**存在：并进 rust job 当 step 的话，
  # 「stable 绿」与「MSRV 绿」就分不清是谁的功劳。
  msrv:
    name: MSRV — 按 rust-version 真编一次
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - id: msrv
        name: 从 Cargo.toml 取 rust-version
        run: |
          set -euo pipefail
          v="$(sed -n 's/^rust-version = "\(.*\)"/\1/p' Cargo.toml)"
          # 取不到就**响的红**，别让空值传下去：空 toolchain 输入不会得到「就是我们
          # 要的那个版本」，而是别的工具链 —— 那就是「漂了却看不出来」，比钉住一个
          # 会漂的版本号更坏。同理，`rust-version.workspace = true` 那种继承写法在
          # 这里取不到值（上面只认顶层那个键），走的就是这条红。
          [ -n "$v" ] || { echo "::error::Cargo.toml 里取不到 rust-version（键改名/挪走了？）—— 拒绝回落到默认工具链"; exit 1; }
          # 形态也要当场认：rustup 说明符形如 1.88 / 1.88.0。
          grep -Eq '^[0-9]+\.[0-9]+(\.[0-9]+)?$' <<<"$v" || { echo "::error::rust-version 的形态不认识: '$v'"; exit 1; }
          echo "rust-version = $v —— 本 job 将在这个工具链上编译"
          echo "v=$v" >> "$GITHUB_OUTPUT"

      # ⚠️ 这里用浮动 ref @master 是**为了能传 toolchain 输入**，不是图省事：要按声明
      # 换工具链，就需要一个不把版本写进 ref 的 ref。别"顺手"把它钉回 @1.88.0 之类 ——
      # 那样上面那条推导就成摆设，「声明被下调仍全绿」会立刻回来。
      # 信任级别与现有 @stable 相同（都是该仓库的分支 ref，不是 SHA 钉法）。
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ steps.msrv.outputs.v }}

      - name: cargo check --workspace --all-targets --locked
        run: cargo check --workspace --all-targets --locked

  android:
    name: Android — JVM unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # 只跑单测：走纯 JVM 假实现，不需要 dart，也不需要 .so。
      # assembleDebug 不在 CI 里 —— 它需要 dart（cargokit 的构建工具是 Dart 写的）。
      - name: ./gradlew testDebugUnitTest
        run: ./gradlew testDebugUnitTest --no-daemon
        working-directory: android

  fcitx5:
    name: fcitx5 — C++ 编译 + 打包落点 + debian:12 真编真加载
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # 这个 job 补上两件此前无人守的事：
      #
      # 1) fcitx5 的 C++ 胶水**从未被编译器看过**。它只由手工 harness 编译，
      #    而 harness 进不了 CI（要 dbus + 私有会话）。这里只编译 + 链接，
      #    不需要 dbus —— 与 rust job 里那几条 Apple 目标 check 同一个用意。
      #
      # 2) 「装完了但用不了」：cmake --install 的落点必须等于 loadDictionary()
      #    的查找结果。用户侧的表现是候选永远只剩内置那几十个词，且**没有任何
      #    报错**，所以只能在 CI 里拿真 fcitx5 库问出来（见下）。
      #
      # 3) 「为目标发行版编出来的产物，能不能在目标发行版上加载」—— 容器步骤里**先**用
      #    debian:12 自己的 5.0 头编一次胶水，**再把它装上去让容器里的 fcitx5 真加载**。
      #    这条断言以前是反的（加载 runner 编的暂存树），而 runner 的 GCC 永远比 debian:12
      #    新 ⇒ 它构造上必假、每次 push 都红 —— 恒红的门禁不是门禁，是噪音（v1.3.0 就是
      #    这么带着红 CI 发出去的）。「新机器编的产物能不能落在旧机器上」这个问题由
      #    packages.yml 直接量**发出去的真产物**来守，判据同源且更贴 —— 一个判据量在正确
      #    的地方，胜过两个地方各量一半。
      - name: 装 fcitx5 头/库
        run: |
          sudo apt-get update
          sudo apt-get install -y libfcitx5core-dev libfcitx5utils-dev libfcitx5config-dev

      - uses: dtolnay/rust-toolchain@stable

      - name: 构建 Rust cdylib（安装规则要一并装它）
        run: cargo build --release -p fcitx5_opi

      # 前缀取 /usr 是**发行版打包的真实形态**：此时 fcitx5 的 CMake 包给出的是
      # 它自己的 addon 目录（/usr/lib/<arch>/fcitx5）。取缺省的 /usr/local 则得到
      # /usr/local/lib/fcitx5，而发行版 fcitx5 不搜那里 —— cpp/CMakeLists.txt 会为
      # 此发 warning（已在本机实测该 warning 会触发）。
      # 用 DESTDIR 而不是 --prefix：addon 目录是绝对路径，只有 DESTDIR 挪得动它。
      - name: cmake 配置 / 构建 / 装到暂存树
        run: |
          set -euo pipefail
          cmake -S crates/fcitx5-opi/cpp -B build-fcitx5 \
            -DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_PREFIX=/usr
          cmake --build build-fcitx5
          DESTDIR="$PWD/stage" cmake --install build-fcitx5 | tee install.log

      # 期望值**不写死**，从 --install 自己打印的落点里取。于是断言是
      # 「安装器说它装到了哪」==「fcitx5 说它去哪找」—— 两个独立来源。
      # 写死期望值的话，把 DESTINATION 改坏了只要顺手改期望值就永远绿。
      #
      # 探针是 cpp/CMakeLists.txt 的 ALL 目标（build-fcitx5/opi_locate_check），
      # include 目录继承 opi_fcitx5_deps。此前这里手写一行 g++ 且**漏了 -I**，
      # 于是这个探针从写完到 v1.3.0 发布**一次都没被编译器看过** —— 发布 CI
      # 就红在它身上，而它下面的 grep 常量门禁被 skip、从未跑过。
      #
      # ⚠️ 下面这套 locate() 映射是在 fcitx5 **5.1.12** 上实测的，runner
      # （ubuntu-latest，apt 装的发行版版本）是 **5.1.7** —— 该映射**未在 5.1.7
      # 上验过**。这条若是首次在 runner 上红，先分清是版本差异还是真装错了，
      # 别顺手改 DESTINATION 去迎合。
      - name: 断言落点 == 查找位置，且装入的就是入库那份词库
        run: |
          set -euo pipefail
          stage="$PWD/stage"
          pick() {
            sed -n 's/^-- \(Installing\|Up-to-date\): //p' install.log \
              | grep -- "$1" | head -1
          }
          # 只按**文件名**取，不把期望目录写进 pattern：写进去的话，把 DESTINATION
          # 改坏只会得到一句「日志里没找到」，看不出真正的原因。按文件名取，坏掉的
          # 落点会一路传到下面探针里，报出来的是「fcitx5 说它在别处找」。
          dict=$(pick 'luna\.opid$')
          addon=$(pick 'opi_fcitx5\.conf$')
          im=$(pick 'inputmethod/opi\.conf$')
          for v in "$dict" "$addon" "$im"; do
            [ -n "$v" ] || { echo "!! 安装日志里没有对应落点，别在空值上比"; exit 1; }
          done
          echo "安装器落点: $dict"
          locate_check=build-fcitx5/opi_locate_check
          [ -x "$locate_check" ] || {
            echo "!! $locate_check 不存在 —— 它是 CMakeLists 的 ALL 目标，"
            echo "   cmake --build 就该产出它。缺了说明构建那步被改过。"
            exit 1
          }
          # 丢掉 XDG_DATA_HOME：只让 XDG_DATA_DIRS（暂存树）起作用。否则 runner
          # 上若恰好有真的词库，测的就不是我们刚装的那份了。
          env -u XDG_DATA_HOME XDG_DATA_DIRS="$stage/usr/share" \
            "$locate_check" "$dict" "$addon" "$im"

          # ---- 身份：落点对只证明「装到对的地方」，不证明「装的是对的东西」----
          # 拿 -DOPI_LUNA_OPID=data/generated/fallback.opid（715B / 35 词）装成
          # luna.opid 时，上面那条探针**照样全绿**（它比的是路径），而用户侧的
          # 表现是「装了、能用、候选只剩内置那几十个词」—— 与「压根没装」在
          # 用户侧不可区分。故这里比的是**入库源**（android 部署副本，也是
          # CMakeLists 的缺省源），不是本次配置用的 -DOPI_LUNA_OPID：后者被改坏
          # 时正是要抓的那一种。
          ref=android/app/src/main/assets/luna.opid
          # 条目数取头部 count 字段，头部布局见 crates/engine-data/src/format.rs：
          #   MAGIC "OPID"(4) + version u16(2) + flags u8(1) + count u32(4, LE)
          # 先验 MAGIC：不然读出来的是文件开头任意 4 字节，会被当成条目数打印出去。
          entries() {
            [ "$(head -c4 "$1")" = OPID ] || { echo "!! $1 头部不是 OPID" >&2; exit 1; }
            od -An -tu4 -j7 -N4 "$1" | tr -d ' '
          }
          echo "装入:   $dict"
          echo "        size=$(stat -c %s "$dict") md5=$(md5sum "$dict" | cut -d' ' -f1) 条目=$(entries "$dict")"
          echo "入库源: $ref"
          echo "        size=$(stat -c %s "$ref") md5=$(md5sum "$ref" | cut -d' ' -f1) 条目=$(entries "$ref")"
          # 三条分开断言，是为了坏的时候能看出坏在哪：size 不符 = 拷了一半、
          # 条目数不符 = 换了个词库、size 与条目数都对而 md5 不符 = 同规模但内容不同。
          [ "$(stat -c %s "$dict")" = "$(stat -c %s "$ref")" ] || {
            echo "!! 装入的词库 size 与入库源不符"; exit 1; }
          [ "$(entries "$dict")" = "$(entries "$ref")" ] || {
            echo "!! 装入的词库条目数与入库源不符"; exit 1; }
          [ "$(md5sum "$dict" | cut -d' ' -f1)" = "$(md5sum "$ref" | cut -d' ' -f1)" ] || {
            echo "!! 装入的词库与入库源不是同一份内容（size 和条目数相同也不行）"; exit 1; }
          echo "身份相符：装进去的就是入库那份 luna.opid"

      # opi_locate_check.cpp 里的相对路径是手抄的 —— 它自己不读 opi_fcitx5.cpp，
      # 所以改了查找常量它**照样绿**。这条把那份手抄钉住：改了 loadDictionary()
      # 的类型或路径，这里先红，而不是等用户装完发现候选只剩几十个词。
      - name: loadDictionary() 的查找常量没漂
        run: |
          set -euo pipefail
          f=crates/fcitx5-opi/cpp/opi_fcitx5.cpp
          grep -q 'Type::Data, "opi/luna.opid"' "$f" || {
            echo "!! $f 里 loadDictionary() 的查找类型/路径变了。"
            echo "   要同步三处：cpp/CMakeLists.txt 的安装落点、opi_locate_check.cpp、"
            echo "   以及 cpp/README.md「安装」一节。"
            exit 1
          }

      # ---- 行为门禁：最老的被测发行版上，addon 必须**真的被加载** ----
      #
      # 为什么必须有这条：data/addon/opi_fcitx5.conf 里 `[Addon/Dependencies]` 的
      # `0=core:X` 是**声明式门槛**，不是能力描述 —— X 一旦高于用户机器上 fcitx5 的
      # 版本，addon **整个不加载**（本机实测：同一批 .so，只改这一行的值，写 5.1.0 时
      # fcitx5 日志里该 addon 0 次加载、写 5.0.0 时 1 次）。用户侧的表现是「输入法
      # 选得到、一个字都不出」，而**日志里没有任何 opi 相关的报错** —— 静默的那种坏。
      #
      # 也正因为静默，纯文本断言（「conf 里的数字 ≤ 最老发行的 fcitx5 版本」）没有
      # 意义：挡不住写法变体，只会给人「已经守住了」的错觉。所以判据落在**行为**上：
      # 加载了才算过。再加一次阴性对照（把门槛抬到 99.0.0，必须变成 0 次），一次证明
      # 三件事：上面那条绿不是「反正都会加载」、这一行确实被解析（段内那些 # 注释没把
      # 它读坏）、这道门禁有牙。
      #
      # 三臂的顺序是刻意的：**阳性对照**（门槛压到 0.0.0，必须加载 —— 它不验被测物，
      # 验的是「这套探针在本次运行里确实能打出那一行」）→ **现行值**（conf 里真写的那个
      # 数）→ **阴性对照**。缺了阳性臂，「目标行 0 条」这种红就分不清是 conf 有问题还是
      # harness 压根没触发加载 —— 「三臂全 0、真因是输入法组里没有 opi」正是这个形态。
      #
      # ---- 同一个容器里还有第二件事：拿 5.0 的头**真编一次**，而且编出来的那份
      #      **就是加载面要加载的那份**（顺序：先编 → 换上去 → 加载）----
      #
      # 「装完能加载」抓不到源码级的不兼容：胶水若用了 5.1 才有的头/符号，在 5.0 上可能
      # 只是安静地少个功能（惰性绑定的 dlopen 会放它过去），而构建机上一切正常。所以
      # 按发行版打包那条路（find_package 用系统头）真编一遍，再 `ldd -r`。
      # 这一步也带对照：阳性 —— 构建日志里真有 opi_fcitx5.cpp 的编译行（「cmake 绿了」
      # 可能只是没编它）、且 `-isystem` 指向本容器的 /usr/include/Fcitx5（不是别处的头）；
      # 阴性 —— 往源码副本里注入一个只在 ≥5.1.21 才有的头（standardpaths.h），必须
      # **编不过**，且失败原因必须就是找不到它。只断言「那个头在当前树里不存在」不够
      # （那可能压根没被解析到），变异态才证明这条命令真的解析到 5.0 那棵树。
      # 它的存在性三边用同一条 `find / -xdev -name 'standardpaths*'` 量过：5.0.21(debian:12)
      # 0 条、5.1.12(本机解包) 0 条、5.1.23(Arch) 有 /usr/include/Fcitx5/Utils/fcitx-utils/
      # standardpaths.h —— 两空一有，空才算证据（否则只是「没扫到」）。
      #
      # 为什么编出来的那份要**装上去**再让容器加载（而不是加载 runner 编的暂存树）：
      # 加载面吃 runner 编的树时，那条断言**构造上必假** —— runner（ubuntu-latest）的 GCC
      # 永远比 debian:12 新，于是每次 push 都红。恒红的门禁不是门禁，是噪音（v1.3.0 就是
      # 带着红 CI 发的版）。换成「**为**这个发行版编的东西**能**在这个发行版上用」之后，
      # 它真、且绿；而「在**新机器**上编的产物能不能落在**旧机器**上」由 packages.yml 直接
      # 量**发出去的真产物**来守（判据同源、量的是产物而不是中间树）—— 一个判据量在正确的
      # 地方，胜过两个地方各量一半。天花板预检保留、判据不变，只是现在量的是**即将被加载
      # 的那一份**：它红了只有两种可能（有人把别处编的产物塞进来／引进了超出本发行版的
      # 符号版本），两种都该当场拦。
      #
      # debian 12 是出版时**最老的被测发行版**（fcitx5 5.0.21），也正是这个下界的来源。
      # 容器里铺的就是上面那套 cmake --install 的**同一棵暂存树**，不另造布局 ——
      # 落点对不对交给 fcitx5 自己找不找得到来裁决，这比 opi_locate_check 那个探针更
      # 贴用户（探针问的是「路径对不对」，这里问的是「装完了能不能用」）。换掉的只有胶水，
      # 引擎仍是暂存树里那份 Rust cdylib（它只要 GLIBC_2.34 ≤ 2.36，两边都满足）。
      # 探针**能**在容器里跑（实测它只要 GLIBC_2.34，容器是 2.36），没重跑是因为它的
      # 期望值取自宿主那次 install.log（带 DESTDIR 前缀），而它要断言的事已被这里覆盖。
      #
      # ⚠️ 容器里那段脚本只能写成 `-c '…'`（YAML 块里每一行都带缩进，而 heredoc 的
      # 结束符必须在行首）—— 代价是它躲开了 shellcheck，所以它是**逐字**本机预演过的：
      # 从本文件里抽出这段、在 debian:12 里真跑一遍（2026-09-28 本机实测，喂的是 v1.3.2
      # 发布树当暂存树 —— 也就是 runner 编的那份胶水躺在里面）：整步 EXIT=0；三臂
      # 1 / 1 / 0 条；`sha256(本容器编的) == sha256(装进去的)`（都 0ff705ed911b36ea）；
      # 天花板两行绿（3.4 ≤ 3.4.30、1.3.9 ≤ 1.3.13）；ldd -r 未定义符号 0；
      # 把同一段判据单独喂 runner 编的那份胶水 ⇒ 红（3.4.32 > 3.4.30）—— 判据仍有牙；
      # 注入 <standardpaths.h> 后按预期红（原因就是找不到它）；
      # 把 5.1 才有的符号（CandidateWord::setComment）直接用 asm 标签引用进胶水：
      # 编译+链接**都过**、只有 `ldd -r` 报 undefined symbol ⇒ 门禁红。
      # 最后一条同时说明：**光有「编译过」这半边会漏掉符号级不兼容**。
      - name: debian:12 容器：对 5.0 头真编胶水 → 装上去 → addon 真被加载（三臂对照）
        run: |
          set -euo pipefail
          timeout 600 docker run --rm \
            -v "$PWD/stage:/stage:ro" \
            -v "$PWD/crates/fcitx5-opi:/src:ro" \
            debian:12 bash -euo pipefail -c '
          echo "== 容器: debian $(cat /etc/debian_version) / $(uname -m)"
          export DEBIAN_FRONTEND=noninteractive
          apt-get update -qq > /tmp/apt.log 2>&1 || { tail -20 /tmp/apt.log; exit 1; }
          # 一次装完：加载面要 fcitx5 + dbus；编译面要 cmake/make/g++ 与三个 -dev（裸 debian:12 里
          # --no-install-recommends 装不出 make，理由见 packages.yml 同一份包列表）。
          apt-get install -y -qq --no-install-recommends fcitx5 dbus cmake make g++ \
            libfcitx5core-dev libfcitx5utils-dev libfcitx5config-dev >> /tmp/apt.log 2>&1 \
            || { tail -30 /tmp/apt.log; exit 1; }

          corever="$(dpkg-query -W -f="\${Version}" fcitx5)"
          echo "== fcitx5: $corever"
          case "$corever" in
            5.0.*) ;;
            *) echo "::error::容器里的 fcitx5 不是 5.0.x（$corever）—— 这条门禁的理由是「最老的被测发行版」，"
               echo "   基座一变前提就变了。换基座前先重新确认下界，别让它悄悄变成「随便哪个版本」。"
               exit 1 ;;
          esac

          devver="$(dpkg-query -W -f="\${Version}" libfcitx5core-dev)"
          echo "== 头/库来自 libfcitx5core-dev $devver"
          case "$devver" in
            5.0.*) ;;
            *) echo "::error::容器里的头文件不是 5.0 系（$devver）—— 这条门禁的理由是「最老的被测发行版」"
               exit 1 ;;
          esac

          # 用户装完包之后的落点：上面那套 cmake --install 的暂存树，整棵铺进 /usr
          cp -a /stage/usr/. /usr/
          glue="$(find /usr -name libfcitx5_opi_glue.so -print -quit)"
          [ -n "$glue" ] || { echo "::error::暂存树里没有胶水 .so（$glue）—— /stage 那步就坏了"; exit 1; }
          rustlib=/stage/usr/lib/x86_64-linux-gnu/fcitx5/libfcitx5_opi.so
          dict=/stage/usr/share/opi/luna.opid

          # ==== 一、先在**本容器**里对 5.0 头真编一次胶水 ====
          # 顺序是刻意的：下面的加载面吃的就是这里编出来的那份（见「二、换上去」）。以前顺序反
          # 过来 —— 加载面吃 runner 编的暂存树，而 runner 的 GCC 比 debian:12 新，那条断言
          # **构造上必假**，于是这个 job 每次 push 都红（v1.3.0 就是这么带着红 CI 发出去的）。
          cp -a /src /tmp/src     # /src 是只读挂载（整个 crate，含 ../data）；变异对照要往里加一行

          # $1=源码目录 $2=构建目录 $3=日志前缀。与宿主那步同样的配置口径
          # （Release + /usr 前缀），只是这里用容器自己的 find_package 头。
          build_glue() {
            cmake -S "$1" -B "$2" -DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_PREFIX=/usr \
              -DOPI_RUST_LIB="$rustlib" -DOPI_LUNA_OPID="$dict" \
              -DCMAKE_EXPORT_COMPILE_COMMANDS=ON > "$3-cmake.log" 2>&1 \
              || { echo "--- cmake 配置失败（$3）---"; tail -20 "$3-cmake.log"; return 1; }
            cmake --build "$2" -j2 > "$3-build.log" 2>&1 \
              || { echo "--- 编译失败（$3）---"; tail -40 "$3-build.log"; return 1; }
          }

          build_glue /tmp/src/cpp /tmp/b-real /tmp/real || {
            echo "::error::胶水在 debian:12（fcitx5 $corever / $devver）上编不过 —— 这正是这一步要抓的东西"
            exit 1
          }
          # 阳性对照 1：真编了胶水。「cmake 构建成功」本身可能只是没编它（比如 target 改名、
          # 或被 EXCLUDE_FROM_ALL 摘掉）。
          grep -q "opi_fcitx5.cpp" /tmp/real-build.log || {
            echo "::error::构建日志里没有 opi_fcitx5.cpp 的编译行 ⇒ 这一步没真编胶水，绿了也不算数"
            tail -20 /tmp/real-build.log
            exit 1
          }
          # 阳性对照 2：编的是**这个容器**里的头。compile_commands.json 就是编译命令行本身，
          # 比「装过什么包」更直接 —— 它要是别处的头（比如解包出来的宿主头），下面那两条就假了。
          incs="$(tr "\"," "  " < /tmp/b-real/compile_commands.json \
                  | grep -oE -- "-isystem +[^ ]+" | sed -E "s/^-isystem +//" | sort -u)"
          echo "== 编译命令里的 include 目录（-isystem）："
          echo "$incs" | sed "s/^/   /"
          echo "$incs" | grep -q "^/usr/include/Fcitx5/" || {
            echo "::error::编译命令里没有容器的 /usr/include/Fcitx5 ⇒ 编的不是这个容器的头"
            exit 1
          }
          bad="$(echo "$incs" | grep "Fcitx5" | grep -v "^/usr/include/Fcitx5/" || true)"
          [ -z "$bad" ] || {
            echo "::error::有 fcitx5 头目录不在本容器 /usr/include/Fcitx5 下：$bad"
            exit 1
          }

          # 阴性对照：这一步有没有牙 —— 往源码里加一个只在 ≥5.1.21 才有的头，必须编不过。
          # 它若编得过，说明这条命令解析到的不是 5.0.21 那棵树，上面的绿就是空转。
          # 先记下标记本身：这个头 5.0.21 与 5.1.12 都没有、5.1.23 有。它若红，是「基座变了」；
          # 变异那条若红，是「解析到别处」—— 两种红要分得清。
          marks="$(find /usr/include/Fcitx5 -name "standardpaths.h" | wc -l | tr -d " ")"
          echo "== 容器 /usr/include/Fcitx5 下 standardpaths.h：$marks 个（≥5.1.21 才有的头）"
          [ "$marks" -eq 0 ] || {
            echo "::error::容器里出现了 standardpaths.h ⇒ 基座不是 5.0.21 了，这条对照的前提没了"
            exit 1
          }
          cp -a /tmp/src /tmp/src-mut
          { printf "%s\n" "#include <standardpaths.h>"; cat /tmp/src-mut/cpp/opi_fcitx5.cpp; } \
            > /tmp/src-mut/cpp/opi_fcitx5.cpp.mut
          mv /tmp/src-mut/cpp/opi_fcitx5.cpp.mut /tmp/src-mut/cpp/opi_fcitx5.cpp
          if build_glue /tmp/src-mut/cpp /tmp/b-mut /tmp/mut; then
            echo "::error::注入 5.1 才有的 <standardpaths.h> 后仍编得过 ⇒ 解析到的头不是 5.0.21 那棵，这一步是空转"
            exit 1
          fi
          grep -q "standardpaths.h: No such file or directory" /tmp/mut-build.log || {
            echo "::error::变异态确实编不过，但不是因为找不到 standardpaths.h —— 红错了地方，不能当证据"
            tail -20 /tmp/mut-build.log
            exit 1
          }
          echo "== 阴性对照：注入 <standardpaths.h> 后编译失败，且原因就是找不到它"

          # ==== 二、换上去：加载面吃的是本容器编的这份胶水 ====
          # 换完，断言的语义是「**为**目标发行版编出来的胶水**能**在目标发行版上加载」：真、且绿。
          # 「在**新机器**上编出来的产物能不能在**旧机器**上加载」是另一个问题，交给 packages.yml ——
          # 那边直接量**发出去的真产物**（判据同源），比在这里量 runner 的中间树更贴；
          # 一个判据量在正确的地方，胜过两个地方各量一半。
          # ⚠️ 成本 ≈ 0：不新增容器、不新增 apt，只是把这个文件换成上面刚编出来的那份。
          cp /tmp/b-real/libfcitx5_opi_glue.so "$glue"

          # provenance：绿的来源必须点名。「装进去的」== 「本容器刚编出来的」，否则下面那道天花板
          # 检查分不清是「确实换了」还是「压根没换」—— 后者会让它去量一份没人加载的产物。
          built_sha="$(sha256sum /tmp/b-real/libfcitx5_opi_glue.so | cut -c1-16)"
          inst_sha="$(sha256sum "$glue" | cut -c1-16)"
          echo "== 装入的胶水: $glue"
          echo "   sha256(本容器编的) $built_sha ／ sha256(装进去的) $inst_sha"
          [ "$built_sha" = "$inst_sha" ] || {
            echo "::error::装进去的胶水不是本容器刚编出来的那份 ⇒ 下面量到的天花板与被加载的不是同一个文件"
            exit 1
          }

          # ---- 天花板预检（判据不变）：量**即将被加载的那一份** ----
          # 它现在应当绿 —— 产物就在本容器里编，引用不出本容器 libstdc++ 没有的符号版本。
          # 它该红的场景只剩两类，两类都值得当场拦下：有人又把别处编的产物塞进这个加载面；或
          # 产物引进了超出本发行版的符号版本（换了运行库、加了静态链接的第三方）。判据的两个细节
          # 是**预演里现过形**才写上的：
          #   · 正则要收基底版 `GLIBCXX_3.4` —— 只写 3.4.x 会漏掉「只要求基底版」的构件，而那恰是
          #     旧容器里编出来的那种（实测：debian:12 编的胶水只要 GLIBCXX_3.4）；
          #   · `grep` 无匹配退出 1，在 `set -o pipefail` 下会把整个步骤**静默**杀掉（一个字输出都
          #     没有），所以失败就地吃掉；「量不出」的含义由调用处判。
          ceil() { { grep -aoE "$2" "$1" || true; } | sort -uV | tail -1; }
          for pat in "GLIBCXX_3\.4(\.[0-9]+)?" "CXXABI_[0-9.]+"; do
            art="$(ceil "$glue" "$pat")"
            ref="$(ceil /lib/x86_64-linux-gnu/libstdc++.so.6 "$pat")"
            echo "== 产物要求 $pat 上限 ${art:-（不引用）} ／ 本容器提供 $ref"
            [ -n "$ref" ] || { echo "::error::本容器的 libstdc++ 量不出 $pat —— 容器不对，先修环境"; exit 1; }
            if [ -n "$art" ] && [ "$art" != "$ref" ] \
              && [ "$(printf "%s\n%s\n" "$art" "$ref" | sort -uV | tail -1)" != "$ref" ]; then
              echo "::error::被加载的这份胶水要求的 $pat（$art）高于本容器提供的（$ref）—— 它在这台机器上加载不了。"
              echo "   若这是别处编的产物，把构建挪进目标发行版的容器（packages.yml 那样）；若它确实是本容器编的，"
              echo "   说明引进了超出本发行版的运行库/符号，当场查。"
              exit 1
            fi
          done

          # ==== 三、即将被加载的这份的依赖解析。判据取 ldd -r 的**文本**（缺库、未定义符号分别数），
          # 不是它的退出码 —— ldd 只在「库找不到」时返回非零，未定义符号不影响退出码。
          # 量**安装态**（引擎就在同一个目录里，$ORIGIN rpath 才解析得到），不是 /tmp 的构建产物。
          so="$glue"
          [ -f "$so" ] || { echo "::error::装上去的胶水不见了：$so"; exit 1; }
          ldd -r "$so" > /tmp/ldd.log 2>&1 || true
          echo "== ldd -r 里 opi/fcitx5 相关的行："
          grep -E "fcitx5|Fcitx5" /tmp/ldd.log | sed "s/^/   /" || true
          nf="$(grep -c "not found" /tmp/ldd.log || true)"
          nu="$(grep -c "undefined symbol" /tmp/ldd.log || true)"
          echo "== ldd -r: not found $nf 行 / undefined symbol $nu 行"
          [ "$nf" -eq 0 ] || {
            echo "::error::有依赖没解析出来（not found $nf 行）—— \$ORIGIN rpath 或容器里缺运行时库"
            grep "not found" /tmp/ldd.log
            exit 1
          }
          [ "$nu" -eq 0 ] || {
            echo "::error::有 $nu 处未定义符号 —— 5.0 的库里没有它，正是这一步要抓的那一类"
            grep "undefined symbol" /tmp/ldd.log
            exit 1
          }

          # 用户加过 OPI 之后的输入法组。触发加载的是**这个**，不是 --enable：
          # OnDemand=True 的 addon 要靠真被用到才加载（实测：只给 --enable、组里没有
          # opi 时是 0 次 —— 「加载了没有」这件事只能从行为上看到）。
          mkdir -p /root/.config/fcitx5
          printf "%s\n" \
            "[Groups/0]" "Name=Default" "Default Layout=us" "DefaultIM=opi" "" \
            "[Groups/0/Items/0]" "Name=keyboard-us" "Layout=" "" \
            "[Groups/0/Items/1]" "Name=opi" "Layout=" "" \
            "[GroupOrder]" "0=Default" > /root/.config/fcitx5/profile

          conf=/usr/share/fcitx5/addon/opi_fcitx5.conf

          # 起一次 fcitx5，返回日志里目标行的条数。两次跑各用各的日志文件，
          # 不吃前一次的残留（两个实例可以同时活着，实测）。
          try_load() {
            rm -f "$1"
            dbus-run-session -- fcitx5 </dev/null >"$1" 2>&1 &
            for _ in $(seq 1 80); do
              grep -q "Loaded addon opi_fcitx5" "$1" && break
              sleep 0.25
            done
            grep -c "Loaded addon opi_fcitx5" "$1" || true
          }

          cp "$conf" /tmp/conf.installed

          # 阳性对照：把门槛压到任何 core 之下（0.0.0），它**必须**加载。这一臂不验被测物，
          # 验的是「这套 harness 在本次运行里确实能打出那一行」。缺了它，「现行值 0 条」
          # 这种红就分不清是 conf 有问题还是探针根本没触发加载。
          sed -i "s/^0=core:.*$/0=core:0.0.0/" "$conf"
          n0="$(try_load /tmp/fx0.log)"
          started0="$(grep -c "Loaded addon " /tmp/fx0.log || true)"
          echo "== 阳性对照（门槛 0.0.0）⇒ 目标行 $n0 条（该次运行共加载 $started0 个 addon）"
          if [ "$started0" -lt 1 ]; then
            echo "::error::阳性对照那次 fcitx5 没起来（0 个 addon）—— 先修容器/harness"
            tail -20 /tmp/fx0.log || true
            exit 1
          fi
          if [ "$n0" -lt 1 ]; then
            echo "::error::阳性对照没加载（门槛已压到 0.0.0）⇒ 是这套探针/harness 不行，不是 conf 的事"
            tail -15 /tmp/fx0.log || true
            exit 1
          fi
          cp /tmp/conf.installed "$conf"   # 复原：下面验的是 conf 里真写的那个数

          floor="$(sed -n "s/^0=core:\(.*\)$/\1/p" "$conf")"
          n="$(try_load /tmp/fx1.log)"
          started="$(grep -c "Loaded addon " /tmp/fx1.log || true)"
          echo "== 声明的 core 门槛 $floor ⇒ 目标行 $n 条（该次运行共加载 $started 个 addon）"
          # 先证明 fcitx5 真的起来了：不然「0 条」可能是「压根没跑」，那种绿比红更坏。
          if [ "$started" -lt 1 ]; then
            echo "::error::fcitx5 没起来（一个 addon 都没加载）—— 先查它为什么起不来，别把这读成「门槛没问题」"
            tail -20 /tmp/fx1.log || true
            exit 1
          fi
          if [ "$n" -lt 1 ]; then
            echo "::error::门槛 $floor 时 addon 没被加载（fcitx5 $corever）"
            echo "   这一行是**唯一**的观测：门槛不满足时 fcitx5 不会就 opi 报任何错，"
            echo "   用户看到的是「输入法选得到、一个字都不出」。"
            echo "--- 装进去的 conf 里那道门槛 ---"
            grep -n "^0=core:" "$conf" || echo "   （没有 ^0=core: 这一行 —— 门槛本身丢了）"
            echo "--- fcitx5 日志尾部 ---"
            tail -15 /tmp/fx1.log || true
            exit 1
          fi

          # 阴性对照：门槛抬到任何 core 之上，必须不再加载
          sed -i "s/^0=core:.*$/0=core:99.0.0/" "$conf"
          n2="$(try_load /tmp/fx2.log)"
          started2="$(grep -c "Loaded addon " /tmp/fx2.log || true)"
          echo "== 阴性对照（门槛 99.0.0）⇒ 目标行 $n2 条（该次运行共加载 $started2 个 addon）"
          if [ "$started2" -lt 1 ]; then
            echo "::error::阴性对照那次 fcitx5 没起来 ⇒ 这个 0 不能算数"
            tail -20 /tmp/fx2.log || true
            exit 1
          fi
          if [ "$n2" -ne 0 ]; then
            echo "::error::门槛抬到 99.0.0 仍然加载 ⇒ 这一行根本没被 fcitx5 读，这道门禁没有牙"
            exit 1
          fi
          echo "== 通过：fcitx5 $corever 上加载了、且那道门槛确实在起作用"
          echo "== 通过：这份胶水是在本容器里对 5.0 头真编的、装上去后被 fcitx5 $corever 真加载了，ldd -r 干净"
          '
