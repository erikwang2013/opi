# SPDX-License-Identifier: MIT
#
# nFPM 配置：把 CMake 的**暂存安装树**原样搬进 .deb / .rpm。
# 由 scripts/build-packages.sh 驱动，${...} 占位符由该脚本 **sed 注入**（脚本自己
# 渲染，不靠 nfpm 展开 —— 理由见脚本里那段注释）。
#
# ⚠️ 这里**不重复声明任何安装落点**。落点由 crates/fcitx5-opi/cpp/CMakeLists.txt 的
# install() 决定，而它被 opi_locate_check 对着**真 fcitx5 库**验过（问真库
# 「loadDictionary() 会去哪找」，再与 cmake --install 的落点比）。打包侧再抄一份
# 路径 = 造一个会漂的第二真源 —— 那正是本项目反复栽过的那类问题。
# 暂存树那条是唯一**从 CMake 树来**的 contents；另有三条例外，都不是 CMake 落点的
# 第二真源：
#   · LICENSE / LICENSE.md：授权文本，原本就不在 CMake 树里（见各自的注释）；
#   · ${PKG_CTL_BIN} → /usr/bin/opi-ctl：Rust 侧编的 CLI，**不属于 CMake 树** ——
#     CMakeLists 只装 fcitx5 侧的胶水与数据，opi-ctl 由 build-packages.sh 里的
#     cargo 现编；cargo 装不了 /usr/bin，落点只能在这里声明，一处。

# 维护脚本（2026-10-17 用户裁决「安装的时候中断正在运行的应用，安装后启动」的
# Linux 等价物 —— Windows MSI 那套由 postprocess-windows-msi.sh 的 taskkill +
# WixShellExec 承担）。deb 与 rpm 共用这三份（nfpm 分别装成 preinst/postinst/
# prerm 与 %pre/%post/%preun）。理由与边界写在各自的文件头。
# 路径相对**本文件所在目录**（nfpm 按配置文件目录解析）。
scripts:
  preinstall: packaging/preinstall.sh
  postinstall: packaging/postinstall.sh
  preremove: packaging/preremove.sh

name: opi
arch: ${PKG_ARCH}
platform: linux
version: ${PKG_VERSION}
section: utils
priority: optional
maintainer: erik.xyz
vendor: OPI
homepage: https://github.com/erikwang2013/opi

# 代码是 MIT，但本包**同时分发词库数据**，而数据与代码分开授权（见随包安装的
# LICENSES.md）。这里的 license 字段只够表达代码那一半，别把它读成整包的授权声明。
license: MIT

description: |
  opi输入法 —— fcitx5 插件（含简体词库）
  模糊拼音 · 简拼 · 中文标点 · 全角半角 · 符号面板。
  安装后重启 fcitx5 并在「输入法」里添加 opi输入法 即可使用。

depends:
  - fcitx5

# ⚠️ 版本约束必须**按格式分开写**：deb 的语法是 `pkg (>= v)`，rpm 是 `pkg >= v`。
# 写成同一条会让另一种格式拿到语法不对的依赖串。
#
# 为什么必须有：addon conf 里的门槛（`[Addon/Dependencies]`）是**声明式**的 ——
# 实测在 fcitx5 低于它时，插件**完全静默地不加载**（无 error 无 warn，唯二症状是
# 日志里少一行 `Loaded addon`、以及 /proc/<pid>/maps 里没有它），用户拿到的是
# 「输入法能选中、一个字都不出」。而 packager 侧此前只声明了 `fcitx5` 不带版本
# ⇒ **低于门槛的系统上 apt/rpm 会装成功、然后静默失效**。带上约束，apt/dnf 就会
# 当场报依赖不满足 —— 把一种静默失败换成一次显式拒绝。
# 版本取 5.0：那是实测出来的下界（5.0.21 / 5.0.14 都编得过、加载得了、出字正确）。
#
# ⚠️ **第二条下限：glibc ≥ 2.34**（比上面那条更紧）。Rust 侧编出的 `libfcitx5_opi.so`
# 要 `GLIBC_2.34`（`readelf -V` 实测）。于是有效下界是 **Debian 12 / Ubuntu 22.04**：
# Debian 11 有 fcitx5 5.0.9 + glibc 2.31 ⇒ **装得上、插件加载不了、静默** ——
# 与 addon conf 那条门槛的失效形态**一模一样**，所以按同一条原则办：写进依赖，
# 让包管理器当场拒，别让它静默。
#   deb 侧包名是 `libc6`，rpm 侧是 `glibc`（两族命名不同，别混用）。
overrides:
  deb:
    depends:
      - fcitx5 (>= 5.0)
      - libc6 (>= 2.34)
  rpm:
    depends:
      - fcitx5 >= 5.0
      - glibc >= 2.34

contents:
  # 暂存树整棵 —— 落点见上面那段说明
  - src: ${PKG_STAGE}/usr
    dst: /usr
  # 暂存树的 /etc（2026-10-10 补）：合并桌面应用时 dpkg-deb -x 会解出
  # /etc/xdg/autostart/opi-statusbar.desktop（状态栏随会话自启），但 contents
  # 不加这一条它就被**静默丢掉** —— 实测形态：注入进了桌面包、没进主包，
  # 用户装完永远没有自启。build-packages.sh 的合并负控会把「文件在不在
  # 暂存树」断言住，这一条负责让它在包里。
  # ⚠️ 不合并桌面应用时暂存树没有 /etc ⇒ Glob failed；build-packages.sh 会
  # `mkdir -p` 一个空的顶住（空目录 nfpm 不打包任何文件）。
  - src: ${PKG_STAGE}/etc
    dst: /etc
  # 桌面状态栏调用的 CLI（2026-10-10 接线，契约：desktop-ui 用 ProcessBuilder 按
  # **名字**调 opi-ctl —— 所以必须在 PATH 上的 /usr/bin，别改名、别挪去
  # /usr/libexec 或 /usr/share/opi）。deb/rpm 都要（本文件对两种格式是同一份）。
  # 源是 cargo 产物，由 build-packages.sh 编好后经 ${PKG_CTL_BIN} 注入。
  # ⚠️ 权限**显式写 0755**（同 CMakeLists 那两条 .so 的理由：不押在工具缺省上 ——
  # 缺省是不是 0755 没验过，也不该验了才知道）。判据在**包**里：dpkg-deb -c 的第一个
  # 字段（本地打包验证那步会打出来）。
  - src: ${PKG_CTL_BIN}
    dst: /usr/bin/opi-ctl
    file_info:
      mode: 0755
  # ⚠️ 许可证文本**必须随包分发**：luna.opid 由 LGPL-3.0（rime-luna-pinyin）、
  # Apache-2.0（rime-pinyin-simp）、GPL-3.0-only（rime-ice，2026-10-11 起）等
  # 数据编译而来，各自要求在分发物中保留许可与署名；GPL-3.0 还要求随分发物
  # 提供完整许可文本。少了这三个文件，包在授权上就是不完整的（而代码照样能跑，
  # 所以它不会自己暴露 —— 只能在打包时守住）。
  # 2026-10-14 起另外两份码表（wubi86.opid = LGPL-3.0，与 luna 同族；wubi98.opid =
  # Unlicense 公共领域）也随包装入 —— 逐源的许可与残留不一致（86 的 rime AUTHORS
  # 写 LGPL 而上游 acevery 仓 COPYING 是 GPL-3.0 全文）都逐字记在
  # data/raw/LICENSES.md 里，**该文件就是署名载体**；LGPL/GPL 族的完整文本由上面
  # 那两个文件（LICENSE + GPL-3.0.txt）承担义务。Unlicense 无文本义务（公有领域）。
  - src: LICENSE
    dst: /usr/share/doc/opi/LICENSE
  - src: data/raw/LICENSES.md
    dst: /usr/share/doc/opi/LICENSES.md
  - src: data/raw/GPL-3.0.txt
    dst: /usr/share/doc/opi/GPL-3.0.txt
