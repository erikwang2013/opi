# SPDX-License-Identifier: MIT
#
# nFPM 配置：把 CMake 的**暂存安装树**原样搬进 .deb / .rpm。
# 由 scripts/build-packages.sh 驱动，四个 ${...} 由该脚本以环境变量注入。
#
# ⚠️ 这里**不重复声明任何安装落点**。落点由 crates/fcitx5-opi/cpp/CMakeLists.txt 的
# install() 决定，而它被 opi_locate_check 对着**真 fcitx5 库**验过（问真库
# 「loadDictionary() 会去哪找」，再与 cmake --install 的落点比）。打包侧再抄一份
# 路径 = 造一个会漂的第二真源 —— 那正是本项目反复栽过的那类问题。
# 所以本文件只有一条 contents：把暂存树的 usr/ 整棵搬成包里的 /usr/。

name: opi
arch: ${PKG_ARCH}
platform: linux
version: ${PKG_VERSION}
section: utils
priority: optional
maintainer: erik.xyz
vendor: OPI
homepage: https://github.com/erikwang2013/opi

# 代码是 MIT，但本包**同时分发词库数据**，而数据与代码分开授权（见随包安装的
# LICENSES.md）。这里的 license 字段只够表达代码那一半，别把它读成整包的授权声明。
license: MIT

description: |
  OPI 拼音输入法 —— fcitx5 插件（含简体词库）
  模糊拼音 · 简拼 · 中文标点 · 全角半角 · 符号面板。
  安装后重启 fcitx5 并在「输入法」里添加 OPI 即可使用。

depends:
  - fcitx5

# ⚠️ 版本约束必须**按格式分开写**：deb 的语法是 `pkg (>= v)`，rpm 是 `pkg >= v`。
# 写成同一条会让另一种格式拿到语法不对的依赖串。
#
# 为什么必须有：addon conf 里的门槛（`[Addon/Dependencies]`）是**声明式**的 ——
# 实测在 fcitx5 低于它时，插件**完全静默地不加载**（无 error 无 warn，唯二症状是
# 日志里少一行 `Loaded addon`、以及 /proc/<pid>/maps 里没有它），用户拿到的是
# 「输入法能选中、一个字都不出」。而 packager 侧此前只声明了 `fcitx5` 不带版本
# ⇒ **低于门槛的系统上 apt/rpm 会装成功、然后静默失效**。带上约束，apt/dnf 就会
# 当场报依赖不满足 —— 把一种静默失败换成一次显式拒绝。
# 版本取 5.0：那是实测出来的下界（5.0.21 / 5.0.14 都编得过、加载得了、出字正确）。
#
# ⚠️ **第二条下限：glibc ≥ 2.34**（比上面那条更紧）。Rust 侧编出的 `libfcitx5_opi.so`
# 要 `GLIBC_2.34`（`readelf -V` 实测）。于是有效下界是 **Debian 12 / Ubuntu 22.04**：
# Debian 11 有 fcitx5 5.0.9 + glibc 2.31 ⇒ **装得上、插件加载不了、静默** ——
# 与 addon conf 那条门槛的失效形态**一模一样**，所以按同一条原则办：写进依赖，
# 让包管理器当场拒，别让它静默。
#   deb 侧包名是 `libc6`，rpm 侧是 `glibc`（两族命名不同，别混用）。
overrides:
  deb:
    depends:
      - fcitx5 (>= 5.0)
      - libc6 (>= 2.34)
  rpm:
    depends:
      - fcitx5 >= 5.0
      - glibc >= 2.34

contents:
  # 暂存树整棵 —— 落点见上面那段说明
  - src: ${PKG_STAGE}/usr
    dst: /usr
  # ⚠️ 许可证文本**必须随包分发**：luna.opid 由 LGPL-3.0（rime-luna-pinyin）与
  # Apache-2.0（rime-pinyin-simp）的数据编译而来，两者都要求在分发物中保留
  # 许可与署名。少了这两个文件，包在授权上就是不完整的（而代码照样能跑，
  # 所以它不会自己暴露 —— 只能在打包时守住）。
  - src: LICENSE
    dst: /usr/share/doc/opi/LICENSE
  - src: data/raw/LICENSES.md
    dst: /usr/share/doc/opi/LICENSES.md
