[package]
name = "imm32_opi"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

# IMM32 兼容输入法：Windows 把 .ime 加载进宿主进程，导出 Ime* 回调。
# 与 TSF 共用 tsf_opi 的逻辑层（TsfLogic），不复制键路由。
[lib]
crate-type = ["cdylib", "lib"]

[dependencies]
# 逻辑层是 tsf_opi 的 lib 目标；只用到平台中立部分，Windows 专属的 TSF 模块
# 不会在 Linux 主机上编译（tsf_opi 已按 target 隔离）。
tsf_opi = { path = "../tsf-opi" }
engine-core = { path = "../engine-core" }

[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "0.62", default-features = false, features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_System_LibraryLoader",
    "Win32_System_Registry",
    "Win32_UI_Input_Ime",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_WindowsAndMessaging",
] }
windows-core = { version = "0.62", default-features = false }
