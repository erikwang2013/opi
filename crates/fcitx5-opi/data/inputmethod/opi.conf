# OPI 输入法条目。安装到 $XDG_DATA_HOME/fcitx5/inputmethod/opi.conf
# （通常即 ~/.local/share/fcitx5/inputmethod/opi.conf）。
#
# **缺了这个文件，输入法就注册不出来**：可用输入法列表由 fcitx5 扫描
# inputmethod/*.conf 生成，与 addon 的 OnDemand 取值无关。
# Addon= 必须与 data/addon/opi_fcitx5.conf 的文件名（去掉 .conf）一致。
# Configurable=False：本插件没有实现配置界面，留 True 会给用户一个点不开的按钮。
#
# Icon= 是**主题图标名**、不是路径，也不是 fcitx5 自己的目录：fcitx5 把
# inputmethod/*.conf 里的这个键读进 InputMethodEntry::setIcon()，再由
# Instance::inputMethodIcon() 交给 IconTheme::findIcon 在 XDG 图标目录里按名字
# 解析（hicolor 是 XDG 规定的公共回退主题，任何主题的继承链里都有它）。所以文件装进
# <前缀>/share/icons/hicolor/scalable/apps/ 即可被找到 —— 由 cpp/CMakeLists.txt
# 的 install 规则装，值取项目宠物「小欧」的几何真源 docs/opi-pet.svg 原样一份。
# 谁在用这个值（逐条有机制判据，别扩大）：classicui 的**托盘图标**（上面那条链
# 就是它，且 classicui 里对 inputMethodIcon 只有这一个调用点；取不到就回退成
# entry->label() 的文字）；以及 core 的 dbus 模块，它把 icon 连同
# name/label/nativeName/languageCode 一起编进 availableInputMethods 的返回值。
# ⚠️ 本机的 Qt 绑定（libFcitx5Qt6DBusAddons 5.1.9 的 FcitxQtInputMethodEntry）
# **只带 name 与 uniqueName**，所以 Deepin 那个配置工具**看不到**图标 ——
# 别把「值上了线」读成「配置工具里显示得出来」。
# ⚠️ 这里写的名字必须等于装出来的文件名（去扩展名），否则**不报错**、只是没图。
[InputMethod]
Name=OPI
Name[zh_CN]=OPI 拼音
Icon=opi-pet
Label=OPI
LangCode=zh_CN
Addon=opi_fcitx5
Configurable=False
