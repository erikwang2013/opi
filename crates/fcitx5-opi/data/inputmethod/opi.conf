# OPI 输入法条目。安装到 $XDG_DATA_HOME/fcitx5/inputmethod/opi.conf
# （通常即 ~/.local/share/fcitx5/inputmethod/opi.conf）。
#
# **缺了这个文件，输入法就注册不出来**：可用输入法列表由 fcitx5 扫描
# inputmethod/*.conf 生成，与 addon 的 OnDemand 取值无关。
# Addon= 必须与 data/addon/opi_fcitx5.conf 的文件名（去掉 .conf）一致。
# Configurable=False：本插件没有实现配置界面，留 True 会给用户一个点不开的按钮。
[InputMethod]
Name=OPI
Name[zh_CN]=OPI 拼音
Icon=input-keyboard
Label=OPI
LangCode=zh_CN
Addon=opi_fcitx5
Configurable=False
