# OPI 输入法 addon 元数据。安装到 $XDG_DATA_HOME/fcitx5/addon/opi_fcitx5.conf
# （通常即 ~/.local/share/fcitx5/addon/opi_fcitx5.conf）。
#
# 字段取值对齐发行版自带输入法 addon 的惯例（见 /usr/share/fcitx5/addon/pinyin.conf、
# unikey.conf）：Category=InputMethod + OnDemand=True。
#
# Library 的命名规则是 **X → X.so**，不自动补 lib 前缀：这里写 libfcitx5_opi_glue，
# 找的就是 libfcitx5_opi_glue.so（由 cpp/opi_fcitx5.cpp 编译而来）。
#
# OnDemand 的含义是「延迟加载」而非「能不能注册」：实测两种情况都能被
# fcitx5 5.1.12 加载并注册出 opi 输入法（IM 列表来自同目录树下的
# inputmethod/opi.conf，与引擎有没有 override listInputMethods() 无关）。
# 取 True 是为了不在每次 fcitx5 启动时都解析 1.7MB 词库。
#
# 注意：Version 只是本 addon 自己的版本号，真正的兼容性门槛在下面
# [Addon/Dependencies] 的 core 一行。
[Addon]
Name=OPI
Name[zh_CN]=OPI 输入法
Category=InputMethod
Version=5.1.12
Library=libfcitx5_opi_glue
Type=SharedLibrary
OnDemand=True
Configurable=False

[Addon/Dependencies]
# ⚠️ 这一行是**声明式门槛**，不是能力描述：fcitx5 会拿它比对，低了就**整个 addon 不加载**。
# 5.0.0 是实测出来的下界，不是猜的（2026-09-28）：
#   · 编译+链接：5.0.21(debian:12, g++ 12.2) / 5.0.14(ubuntu:22.04, g++ 11.4) / 5.1.12(本机)
#     三边都 `-Wall -Wextra -Werror` 零警告通过，`ldd -r` 未定义符号 0；
#     5.0 与 5.1 的三个库 SONAME 完全相同（libFcitx5Core.so.7 / Utils.so.2 / Config.so.6）——
#     上游自己就没在 5.0→5.1 断过 ABI。
#   · 加载：**带阴性对照** —— 同机同批 .so，只改这一行的值：
#     写 5.1.0 时 fcitx5 日志里 `Loaded addon opi_fcitx5` **0 次**（用户得到一个
#     **能选中、一个字都不出**的输入法）；写 5.0.0 时 **1 次**。
#   · 行为：`opi_e2e.py` 十变体在 5.0.21 / 5.0.14 / 5.1.12 上**结果集一致（9 绿 1 红，
#     那条红在 5.1.12 上同样红、同样报错，不是 5.0 的回归）**，输出逐字节相同；
#     词库在 5.0 上确实装进去了（删掉 luna.opid 则退回内置词库，放回则 `nihao`→`你好`）。
#   · **反向也核过**：5.0.0 这个值在 5.1.12 上照样加载、e2e 全绿 ⇒ 降门槛不会弄坏新版本。
# 上面 `Version=5.1.12` 是**本 addon 自己的版本号**，与这道门槛无关，别跟着改
# （实测带着它在 5.0 上照样加载）。
0=core:5.0.0
