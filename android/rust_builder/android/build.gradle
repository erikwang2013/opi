// The Android Gradle Plugin builds the native code with the Android NDK.

group 'com.flutter_rust_bridge.rust_lib_app'
version '1.0'

buildscript {
    repositories {
        // 阿里云镜像优先：本机 dl.google.com 被 DNS 劫持至 ~2KB/s 慢速镜像。
        maven { url 'https://maven.aliyun.com/repository/google' }
        maven { url 'https://maven.aliyun.com/repository/public' }
    }

    dependencies {
        // The Android Gradle Plugin knows how to build native code with the NDK.
        // 独立工程（includeBuild + Gradle 9.1）：AGP 7.3 与 Gradle 9 不兼容，升到主构建同版本。
        classpath 'com.android.tools.build:gradle:9.0.1'
    }
}

rootProject.allprojects {
    repositories {
        maven { url 'https://maven.aliyun.com/repository/google' }
        maven { url 'https://maven.aliyun.com/repository/public' }
    }
}

apply plugin: 'com.android.library'

android {
    if (project.android.hasProperty("namespace")) {
        namespace 'com.flutter_rust_bridge.rust_lib_app'
    }

    // Bumping the plugin compileSdkVersion requires all clients of this plugin
    // to bump the version in their app.
    // 本机 SDK 无 android-33 平台包（33 平台下载走 dl.google.com，被 DNS 劫持），
    // 本地改为 34；重新生成 frb 代码时会重置为模板值。
    compileSdkVersion 34

    // Use the NDK version
    // declared in /android/app/build.gradle file of the Flutter project.
    // Replace it with a version number if this plugin requires a specfic NDK version.
    // (e.g. ndkVersion "23.1.7779620")
    // 独立工程（无 Flutter 继承）：本机仅 NDK 27.0.12077973。
    ndkVersion "27.0.12077973"

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    defaultConfig {
        // NDK 27 最低支持 API 21（API 19 的 sysroot 不存在，链接 crtbegin_so.o 失败）；
        // 与 app minSdk 21 对齐。
        minSdkVersion 21
    }
}

apply from: "../cargokit/gradle/plugin.gradle"
cargokit {
    // 相对本文件目录（rust_builder/android/）上 3 级 = 仓库根（原 flutter 深处为 4 级）
    manifestDir = "../../../crates/opi-ffi"
    libname = "opi_ffi"
}
