/// This is copied from Cargokit (which is the official way to use it currently)
/// Details: https://fzyzcjy.github.io/flutter_rust_bridge/manual/integrate/builtin

import java.nio.file.Paths
import org.apache.tools.ant.taskdefs.condition.Os
import org.gradle.api.Action
import org.gradle.process.ExecSpec

CargoKitPlugin.file = buildscript.sourceFile

apply plugin: CargoKitPlugin

class CargoKitExtension {
    String manifestDir; // Relative path to folder containing Cargo.toml
    String libname; // Library name within Cargo.toml. Must be a cdylib
}

abstract class CargoKitBuildTask extends DefaultTask {

    // Gradle 9 移除了 Project.exec 全部重载，注入 ExecOperations 替代。
    @javax.inject.Inject
    abstract org.gradle.process.ExecOperations getExecOperations()

    @Input
    String buildMode

    @Input
    String buildDir

    @Input
    String outputDir

    @Input
    String ndkVersion

    @Input
    String sdkDirectory

    @Input
    int compileSdkVersion;

    @Input
    int minSdkVersion;

    @Input
    String pluginFile

    @Input
    List<String> targetPlatforms

    @TaskAction
    def build() {
        if (project.cargokit.manifestDir == null) {
            throw new GradleException("Property 'manifestDir' must be set on cargokit extension");
        }

        if (project.cargokit.libname == null) {
            throw new GradleException("Property 'libname' must be set on cargokit extension");
        }

        def executableName = Os.isFamily(Os.FAMILY_WINDOWS) ? "run_build_tool.cmd" : "run_build_tool.sh"
        def path = Paths.get(new File(pluginFile).parent, "..", executableName);

        def manifestDir = Paths.get(project.buildscript.sourceFile.parent, project.cargokit.manifestDir)

        def rootProjectDir = project.rootProject.projectDir

        if (!Os.isFamily(Os.FAMILY_WINDOWS)) {
            execOperations.exec(new Action<ExecSpec>() {
                void execute(ExecSpec spec) {
                    spec.commandLine 'chmod', '+x', path
                }
            })
        }

        execOperations.exec(new Action<ExecSpec>() {
            void execute(ExecSpec spec) {
                spec.executable path
                spec.args "build-gradle"
                spec.environment "CARGOKIT_ROOT_PROJECT_DIR", rootProjectDir
                spec.environment "CARGOKIT_TOOL_TEMP_DIR", "${buildDir}/build_tool"
                spec.environment "CARGOKIT_MANIFEST_DIR", manifestDir
                spec.environment "CARGOKIT_CONFIGURATION", buildMode
                spec.environment "CARGOKIT_TARGET_TEMP_DIR", buildDir
                spec.environment "CARGOKIT_OUTPUT_DIR", outputDir
                spec.environment "CARGOKIT_NDK_VERSION", ndkVersion
                spec.environment "CARGOKIT_SDK_DIR", sdkDirectory
                spec.environment "CARGOKIT_COMPILE_SDK_VERSION", compileSdkVersion
                spec.environment "CARGOKIT_MIN_SDK_VERSION", minSdkVersion
                spec.environment "CARGOKIT_TARGET_PLATFORMS", targetPlatforms.join(",")
                spec.environment "CARGOKIT_JAVA_HOME", System.properties['java.home']
            }
        })
    }
}

class CargoKitPlugin implements Plugin<Project> {

    static String file;

    private static String resolveSdkDir(Project project) {
        def localProps = project.rootProject.file('local.properties')
        if (localProps.exists()) {
            def props = new Properties()
            localProps.withInputStream { props.load(it) }
            def sdk = props.getProperty('sdk.dir')
            if (sdk != null) return sdk
        }
        def env = System.getenv('ANDROID_HOME')
        if (env != null) return env
        env = System.getenv('ANDROID_SDK_ROOT')
        if (env != null) return env
        throw new GradleException("Android SDK location not found (set sdk.dir in local.properties or ANDROID_HOME).")
    }

    @Override
    void apply(Project project) {
        project.extensions.create("cargokit", CargoKitExtension)

        def cargoBuildDir = "${project.buildDir}/build"

        // AGP 9 移除了 applicationVariants/libraryVariants，改用 buildTypes 遍历
        // （debug/release 默认存在；android{} 里新增的 buildTypes 也会触发 all）。
        project.android.buildTypes.all { buildType ->

            final String btName = buildType.name

            def cargoOutputDir = "${project.buildDir}/jniLibs/${btName}";
            def jniLibs = project.android.sourceSets.maybeCreate(btName).jniLibs;
            jniLibs.srcDir(new File(cargoOutputDir))

            // 独立工程（无 Flutter）：固定三 ABI，与 app abiFilters 对齐。
            def List<String> platforms = ["android-arm64", "android-arm", "android-x64"]

            // The task name depends on plugin properties, which are not available
            // at this point
            project.getGradle().afterProject {
                def taskName = "cargokitCargoBuild${project.cargokit.libname.capitalize()}${btName.capitalize()}";

                if (project.tasks.findByName(taskName)) {
                    return
                }

                if (project.android.ndkVersion == null) {
                    throw new GradleException("Please set 'android.ndkVersion' in 'android/build.gradle'.")
                }

                // AGP 9 移除了 android.sdkDirectory：从 local.properties / 环境变量解析。
                def sdkDir = resolveSdkDir(project)

                def task = project.tasks.create(taskName, CargoKitBuildTask.class) {
                    buildMode = btName
                    buildDir = cargoBuildDir
                    outputDir = cargoOutputDir
                    ndkVersion = project.android.ndkVersion
                    sdkDirectory = sdkDir
                    minSdkVersion = project.android.defaultConfig.minSdkVersion.apiLevel as int
                    // AGP 9 的 compileSdkVersion DSL 值返回字符串（如 "34"），先解析一次成 int。
                    int compileSdk = project.android.compileSdkVersion.substring(8) as int
                    compileSdkVersion = compileSdk
                    targetPlatforms = platforms
                    pluginFile = CargoKitPlugin.file
                }
                def onTask = { newTask ->
                    if (newTask.name == "merge${btName.capitalize()}NativeLibs") {
                        newTask.dependsOn task
                        // Fix gradle 7.4.2 not picking up JNI library changes
                        newTask.outputs.upToDateWhen { false }
                    }
                }
                project.tasks.each onTask
                project.tasks.whenTaskAdded onTask
            }
        }
    }
}
